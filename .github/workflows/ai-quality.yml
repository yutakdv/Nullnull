name: AI quality

# Early feedback for apps/ai (not a required status; docker-integration stays the merge gate).
# Lint, strict types, pytest with the REC corpus report, and the frozen internal contract sync check.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/ai/**"
      - ".github/workflows/ai-quality.yml"
  push:
    branches: [main, backend]
    paths:
      - "apps/ai/**"
      - ".github/workflows/ai-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-quality:
    name: ai-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ai
    env:
      NULLNULL_ENV: test
      NULLNULL_AI_REPORT_DIR: /home/runner/work/_ai-reports/recommendation
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: apps/ai/.python-version
      - name: Install uv (same pin as apps/ai/Dockerfile)
        run: python -m pip install --no-cache-dir uv==0.12.10
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Type check (mypy strict)
        run: uv run --frozen mypy
      - name: Tests, REC corpus report, internal contract sync
        run: uv run --frozen pytest
      - name: Upload recommendation evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recommendation-ai-${{ github.run_id }}
          path: /home/runner/work/_ai-reports/recommendation/
          if-no-files-found: error
          retention-days: 14

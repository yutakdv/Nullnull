name: API quality

# Early feedback for apps/api (not a required status; docker-integration stays the merge gate).
# Runs the same four Gradle suites the api-quality compose service runs, on a native runner.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/ai/contracts/**"
      - "apps/ai/tests/recommendation/fixtures/**"
      - "apps/ai/tests/recommendation/manifest.json"
      - "apps/ai/src/nullnull_ai/policy/**"
      - "docs/api/openapi.yaml"
      - "docs/engineering/backend-plan.json"
      # ProblemFixtureContractTest pins these to ProblemCode, so a fixture-only
      # edit is a change this suite must see.
      - "packages/contracts/fixtures/**"
      - "scripts/check_test_reports.py"
      - "scripts/check_evaluation_report.py"
      - "scripts/tests/test_check_test_reports.py"
      - ".github/workflows/api-quality.yml"
  push:
    branches: [main, backend]
    paths:
      - "apps/api/**"
      - "apps/ai/contracts/**"
      - "apps/ai/tests/recommendation/fixtures/**"
      - "apps/ai/tests/recommendation/manifest.json"
      - "apps/ai/src/nullnull_ai/policy/**"
      - "docs/api/openapi.yaml"
      - "docs/engineering/backend-plan.json"
      # ProblemFixtureContractTest pins these to ProblemCode, so a fixture-only
      # edit is a change this suite must see.
      - "packages/contracts/fixtures/**"
      - "scripts/check_test_reports.py"
      - "scripts/check_evaluation_report.py"
      - "scripts/tests/test_check_test_reports.py"
      - ".github/workflows/api-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    name: api-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NULLNULL_ENV: test
      APP_COOKIE_SECURE: "true"
      APP_COOKIE_DOMAIN: ""
      APP_PUBLIC_ORIGIN: http://localhost:5173
      APP_SESSION_TTL: P30D
      APP_SESSION_ABSOLUTE_TTL: P90D
      APP_CSRF_TOKEN_TTL: PT2H
      NULLNULL_JOB_RETENTION_SWEEP_INTERVAL: PT1M
      KTO_ALLOWED_HOST: apis.data.go.kr
      SEOUL_ALLOWED_HOST: openapi.seoul.go.kr
      NULLNULL_PROVIDER_CONNECT_TIMEOUT: PT2S
      NULLNULL_PROVIDER_REQUEST_TIMEOUT: PT5S
      NULLNULL_PROVIDER_MAX_RESPONSE_BYTES: "2097152"
      NULLNULL_PROVIDER_EXECUTOR_THREADS: "8"
      NULLNULL_PROVIDER_EXECUTOR_QUEUE_CAPACITY: "32"
      NULLNULL_PROVIDER_PER_SOURCE_CONCURRENCY: "4"
      NULLNULL_PROVIDER_RETRY_ATTEMPTS: "3"
      NULLNULL_PROVIDER_RETRY_BASE_DELAY: PT0.1S
      NULLNULL_PROVIDER_RETRY_MAX_DELAY: PT2S
      NULLNULL_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: "5"
      NULLNULL_PROVIDER_CIRCUIT_FAILURE_WINDOW: PT30S
      NULLNULL_PROVIDER_CIRCUIT_OPEN_DURATION: PT60S
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate deletion token test secret
        run: echo "NULLNULL_DELETION_TOKEN_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .tool-versions
          cache: gradle
          cache-dependency-path: |
            apps/api/gradle/wrapper/gradle-wrapper.properties
            apps/api/gradle/libs.versions.toml
            apps/api/build.gradle.kts
      - name: Unit, PostgreSQL (Testcontainers), OpenAPI contract, apps/ai contract parity
        run: |
          mkdir -p ../../.artifacts
          touch ../../.artifacts/api-quality-start
          ./gradlew --no-daemon test --rerun integrationTest --rerun openapiContractTest --rerun recommendationTest --rerun
      - name: Run the Python-side tests as collectable evidence
        # Acceptance criteria for the build toolchain, the target-stack marker and the CI wrapper
        # itself are provable only here, not in Java. Until this ran as JUnit the aggregator could
        # not see them, so their cards could never be promoted - AGENTS.md recorded that as an open
        # gap. Same tests docs-contract runs; this run is the one that leaves evidence behind.
        if: always()
        run: >-
          python3 ../../scripts/run_script_tests.py
          --out ../../.artifacts/script-test-results
      - name: Validate executed JUnit evidence
        # Deliberately without --backend-plan. Card completeness is the required gate's question
        # because only it can see every kind of evidence: BA-004-T3 is proven by the egress-denied
        # service inside the full Compose run, which this workflow does not start, so asking here
        # would report a card as incomplete on evidence this job structurally cannot produce. This
        # is early feedback (AGENTS.md 등록 규칙 4), and a check that cannot see the answer is worse
        # than no check - it teaches people to ignore it. What stays is what this job CAN judge:
        # that the reports it produced are fresh, complete and free of failures.
        if: always()
        run: >-
          python3 ../../scripts/check_test_reports.py
          --junit-dir build/test-results
          --script-junit-dir ../../.artifacts/script-test-results
          --run-start ../../.artifacts/api-quality-start
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-test-results-${{ github.run_id }}
          path: apps/api/build/test-results/
          if-no-files-found: error
          retention-days: 14

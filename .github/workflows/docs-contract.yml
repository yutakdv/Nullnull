name: Docs and contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-contract:
    name: docs-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate links, refs, operation IDs, and Figma inventory
        run: python scripts/validate_docs.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2
      - name: Lint OpenAPI 3.1
        run: npx --yes @redocly/cli@2.51.1 lint docs/api/openapi.yaml
      - name: Validate event examples against JSON Schema
        run: >-
          npx --yes --package ajv-cli@5.0.0 --package ajv-formats@3.0.1
          ajv validate --spec=draft2020 -c ajv-formats
          -s docs/contracts/events.schema.json
          -d docs/contracts/events.example.json

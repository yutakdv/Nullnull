name: Docs and contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-contract:
    name: docs-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch OpenAPI comparison base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Reject breaking OpenAPI changes
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@9c0494cfee8b8fcc9fb383ed2d5d3fbdae169b93 # v0.1.15
        with:
          base: origin/main:docs/api/openapi.yaml
          revision: docs/api/openapi.yaml
          fail-on: WARN
          # Approved, individually justified exceptions only. test_oasdiff_exceptions.py requires
          # each line to carry a registered reason, approver and issue; the next step fails the
          # build once a line stops matching a real finding, so an exemption cannot outlive its fix.
          #
          # BOTH severities. Only warn-ignore was wired at first, which meant the exception path
          # covered nothing that oasdiff reports as an error - and almost every breaking change is
          # an error. An intended correction therefore had no route through the gate at all, which
          # is a standing invitation to weaken fail-on instead. One file serves both flags so a
          # registered exception cannot be silently limited to the lesser severity.
          err-ignore: docs/api/oasdiff-ignore.txt
          warn-ignore: docs/api/oasdiff-ignore.txt
          review: "false"
          github-token: ""
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Reject stale oasdiff exceptions
        if: github.event_name == 'pull_request'
        run: |
          git show origin/main:docs/api/openapi.yaml > "$RUNNER_TEMP/base-openapi.yaml"
          docker run --rm -v "$RUNNER_TEMP:/spec" -v "$PWD/docs/api:/rev" \
            tufin/oasdiff@sha256:6b06f8a79a1461a9e915625d13d07ff0aba2ea930f1dc154f86fb6ee5f450469 \
            breaking /spec/base-openapi.yaml /rev/openapi.yaml --fail-on WARN \
            > "$RUNNER_TEMP/oasdiff.txt" 2>&1 || true
          python scripts/check_oasdiff_exceptions.py "$RUNNER_TEMP/oasdiff.txt" docs/api/oasdiff-ignore.txt
      - name: Validate contracts, backend plan, and Obsidian references
        run: |
          python scripts/validate_docs.py
          python -m unittest discover -s scripts/tests -p "test_*.py"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2
      - name: Lint OpenAPI 3.1
        run: npx --yes @redocly/cli@2.51.1 lint docs/api/openapi.yaml
      - name: Validate event examples against JSON Schema
        run: >-
          npx --yes --package ajv-cli@5.0.0 --package ajv-formats@3.0.1
          ajv validate --spec=draft2020 -c ajv-formats
          -s docs/contracts/events.schema.json
          -d docs/contracts/events.example.json

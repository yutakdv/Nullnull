name: 기능 / Vertical slice
description: Figma부터 API·데이터·테스트까지 이어지는 구현 작업
title: "[기능] "
labels: []
body:
  - type: input
    id: requirement
    attributes:
      label: 기능 ID
      description: docs/product/FUNCTIONAL_INVENTORY.md의 ID 또는 새로 제안할 ID
      placeholder: FR-CAN-02
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0
        - P1
        - P2
    validations:
      required: true
  - type: input
    id: figma
    attributes:
      label: Figma node / 링크
      placeholder: "399:843 또는 전체 node URL"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 사용자 결과
      description: 구현 수단보다 사용자가 전후에 무엇을 할 수 있는지 적습니다.
    validations:
      required: true
  - type: textarea
    id: domain
    attributes:
      label: 도메인 상태 변화와 불변식
      description: SavedPost/TripCandidate/TripItem, version, lock, 승인 전 미변경 등을 검토합니다.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: API·이벤트·DB 영향
      placeholder: operationId, schema, table/constraint, event name
    validations:
      required: true
  - type: textarea
    id: states
    attributes:
      label: 화면 상태와 접근성
      description: default/loading/empty/error/offline/stale, keyboard/focus/360px를 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: Given / When / Then 또는 검증 가능한 목록
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 개인정보·외부 데이터·배포 위험
  - type: checkboxes
    id: ready
    attributes:
      label: Definition of Ready
      options:
        - label: P0/P1, Figma 상태, 도메인 변화가 명확하다.
          required: true
        - label: OpenAPI/event/ERD 영향이 식별됐다.
          required: true
        - label: 테스트와 실패/degradation 방식이 정의됐다.
          required: true

name: 버그
description: 재현 가능한 결함 또는 계약·데이터·접근성 회귀
title: "[버그] "
labels: []
body:
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - S0 - 데이터 노출/승인 없는 일정 변경/서비스 전체 장애
        - S1 - P0 핵심 흐름 차단
        - S2 - 우회 가능한 주요 결함
        - S3 - 경미한 표시/사용성 결함
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 환경
      options:
        - local
        - staging
        - production
        - Figma/contract only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App/API version
      placeholder: git SHA 또는 release tag
  - type: input
    id: requirement
    attributes:
      label: 기능 ID / Figma node / operationId
  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 비밀값, cookie, 원문 일정, 실제 위치나 사용자 데이터를 붙이지 마세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: input
    id: request_id
    attributes:
      label: Request ID
      description: 지원 UI에 표시된 안전한 requestId만 입력합니다.
  - type: textarea
    id: evidence
    attributes:
      label: 안전하게 제거한 증거
      description: Screenshot/log는 secret, token, 사용자 식별값을 제거합니다.
  - type: checkboxes
    id: safety
    attributes:
      label: 안전 확인
      options:
        - label: 이 issue에 secret, cookie, 원문 일정, 정밀 위치, 실제 사용자 데이터가 없다.
          required: true
        - label: 보안 취약점이면 public issue 대신 private security advisory를 사용했다.
          required: true

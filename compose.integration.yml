name: nullnull-integration

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: nullnull_integration
      POSTGRES_USER: nullnull
      POSTGRES_PASSWORD: integration-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullnull -d nullnull_integration"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - integration-internal

  api-quality:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test
    environment: &api-environment
      SPRING_PROFILES_ACTIVE: integration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nullnull_integration
      SPRING_DATASOURCE_USERNAME: nullnull
      SPRING_DATASOURCE_PASSWORD: integration-only
      NULLNULL_EXTERNAL_NETWORK: disabled
      NULLNULL_TEST_DATABASE: external
      NULLNULL_AI_BASE_URL: http://ai:8090
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./gradlew", "--no-daemon", "--offline", "test", "integrationTest", "openapiContractTest", "recommendationTest"]
    volumes:
      - ./.artifacts/integration/recommendation:/workspace/apps/api/build/reports/recommendation
      - ./.artifacts/integration/api-test-results:/workspace/apps/api/build/test-results
    networks:
      - integration-internal

  web-quality:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: test
    command: ["npm", "run", "verify:ci"]
    networks:
      - integration-internal

  api-client-diff:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: tooling
    working_dir: /workspace
    command: ["npm", "run", "api:check"]
    networks:
      - integration-internal

  security-scan:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: tooling
    working_dir: /workspace
    command: ["npm", "run", "security:scan"]
    networks:
      - integration-internal

  infra-plan:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: tooling
    working_dir: /workspace
    command: ["npm", "run", "infra:check"]
    networks:
      - integration-internal

  ai-quality:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
      target: test
    environment:
      NULLNULL_ENV: test
      NULLNULL_AI_REPORT_DIR: /workspace/apps/ai/build/reports/recommendation
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    command: ["uv", "run", "--frozen", "--offline", "pytest"]
    volumes:
      - ./.artifacts/integration/recommendation-ai:/workspace/apps/ai/build/reports/recommendation
    networks:
      - integration-internal

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
      target: runtime
    environment:
      NULLNULL_ENV: staging
      NULLNULL_AI_BIND_HOST: 0.0.0.0
      NULLNULL_AI_PORT: "8090"
      NULLNULL_CATALOG_VERSION: catalog-integration-fixture
      AI_PROVIDER: NONE
    healthcheck:
      # The runtime image has no curl; the pinned python:3.13-slim standard library is enough.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/internal/v1/health/ready', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - integration-internal

  # integration-internal is internal: true, so published ports are unreachable from the host;
  # scripts/integration-test.sh probes api and web readiness from inside the network instead.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration-internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    environment:
      API_INTERNAL_BASE_URL: http://api:8080
    depends_on:
      - api
    networks:
      - integration-internal

  e2e:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: e2e
    environment:
      PLAYWRIGHT_BASE_URL: http://web:4173
      CI: "true"
    depends_on:
      - api
      - web
    volumes:
      - ./.artifacts/integration/playwright:/workspace/apps/web/playwright-report
      - ./.artifacts/integration/test-results:/workspace/apps/web/test-results
    command: ["npm", "run", "test:e2e:integration"]
    networks:
      - integration-internal

  egress-denied:
    profiles: [quality]
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if curl --fail --silent --show-error --connect-timeout 3 \
          --max-time 5 https://example.com/ >/dev/null; then
          echo "External network unexpectedly reachable from integration network." >&2
          exit 1
        fi
        echo "outbound_network=denied"
    networks:
      - integration-internal

networks:
  integration-internal:
    internal: true

# Image digests are pinned (verify_target_stack.py rejects tags). The api side of the
# B01 contract is in place; apps/web stages, root quality scripts and the
# .nullnull-target-stack marker still land with the web scaffold, and until then
# scripts/integration-test.sh intentionally does not parse this compose file.

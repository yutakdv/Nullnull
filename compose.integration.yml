name: nullnull-integration

services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: nullnull_integration
      POSTGRES_USER: nullnull
      POSTGRES_PASSWORD: integration-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullnull -d nullnull_integration"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - integration-internal

  api-quality:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test
    environment: &api-environment
      NULLNULL_ENV: test
      APP_COOKIE_SECURE: "true"
      APP_COOKIE_DOMAIN: ""
      NULLNULL_DELETION_TOKEN_SECRET: ${NULLNULL_DELETION_TOKEN_SECRET:-}
      APP_PUBLIC_ORIGIN: http://localhost:5173
      APP_SESSION_TTL: P30D
      APP_SESSION_ABSOLUTE_TTL: P90D
      APP_CSRF_TOKEN_TTL: PT2H
      NULLNULL_JOB_RETENTION_SWEEP_INTERVAL: PT1M
      SPRING_PROFILES_ACTIVE: integration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nullnull_integration
      SPRING_DATASOURCE_USERNAME: nullnull
      SPRING_DATASOURCE_PASSWORD: integration-only
      NULLNULL_EXTERNAL_NETWORK: disabled
      NULLNULL_TEST_DATABASE: external
      NULLNULL_AI_BASE_URL: http://ai:8090
      KTO_ALLOWED_HOST: apis.data.go.kr
      SEOUL_ALLOWED_HOST: openapi.seoul.go.kr
      NULLNULL_PROVIDER_CONNECT_TIMEOUT: PT2S
      NULLNULL_PROVIDER_REQUEST_TIMEOUT: PT5S
      NULLNULL_PROVIDER_MAX_RESPONSE_BYTES: "2097152"
      NULLNULL_PROVIDER_EXECUTOR_THREADS: "8"
      NULLNULL_PROVIDER_EXECUTOR_QUEUE_CAPACITY: "32"
      NULLNULL_PROVIDER_PER_SOURCE_CONCURRENCY: "4"
      NULLNULL_PROVIDER_RETRY_ATTEMPTS: "3"
      NULLNULL_PROVIDER_RETRY_BASE_DELAY: PT0.1S
      NULLNULL_PROVIDER_RETRY_MAX_DELAY: PT2S
      NULLNULL_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: "5"
      NULLNULL_PROVIDER_CIRCUIT_FAILURE_WINDOW: PT30S
      NULLNULL_PROVIDER_CIRCUIT_OPEN_DURATION: PT60S
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./gradlew", "--no-daemon", "--offline", "test", "--rerun", "integrationTest", "--rerun", "openapiContractTest", "--rerun", "recommendationTest", "--rerun"]
    volumes:
      - ./.artifacts/integration/recommendation:/workspace/apps/api/build/reports/recommendation
      - ./.artifacts/integration/api-test-results:/workspace/apps/api/build/test-results
    networks:
      - integration-internal

  web-quality:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: test
    # CI turns on Vitest's JUnit reporter (apps/web/vite.config.ts), which the gate's aggregator
    # reads from the bind below - the same pair the e2e service uses for Playwright.
    environment:
      CI: "true"
    volumes:
      - ./.artifacts/integration/vitest:/workspace/apps/web/vitest-report
    command: ["npm", "run", "verify:ci"]
    networks:
      - integration-internal

  api-client-diff:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: tooling
    working_dir: /workspace
    command: ["npm", "run", "api:check"]
    networks:
      - integration-internal

  security-scan:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: tooling
    working_dir: /workspace
    # DX-003: npm audit needs the registry and this service runs on integration-internal, so the
    # report is produced at build time (apps/web/Dockerfile tooling stage) and this run only
    # exports it. The blocking decision is made by scripts/check_npm_audit_report.py on the host,
    # which keeps the gate independent of whether this image carries a Python interpreter.
    # cp fails loudly when the bake did not happen, so a missing report can never read as a pass.
    #
    # Freshness comes from the build, not from this run: `npm audit` is a point-in-time answer and
    # the RUN that produced it is a cacheable layer. CI rebuilds on a runner with no layer cache, so
    # the report a required check judges is always made in that run. A local wrapper run can reuse a
    # cached layer and judge an older report while the lockfile is unchanged; `docker compose build
    # --no-cache security-scan` is what refreshes it. The gate does not reject a report for its age
    # (see IMPLEMENTATION_PLAN.md DX-003).
    command:
      - /bin/sh
      - -ec
      - |
        cp /workspace/.audit/npm-audit.json /workspace/.audit-export/npm-audit.json
        echo "npm_audit_report=exported"
    volumes:
      - ./.artifacts/integration/audit:/workspace/.audit-export
    networks:
      - integration-internal

  infra-plan:
    profiles: [quality]
    build:
      context: .
      dockerfile: infra/Dockerfile
    working_dir: /workspace
    command: ["node", "scripts/infra-check.mjs"]
    networks:
      - integration-internal

  ai-quality:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
      target: test
    environment:
      NULLNULL_ENV: test
      NULLNULL_AI_REPORT_DIR: /workspace/apps/ai/build/reports/recommendation
      APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
    command: ["uv", "run", "--frozen", "--offline", "pytest"]
    volumes:
      - ./.artifacts/integration/recommendation-ai:/workspace/apps/ai/build/reports/recommendation
    networks:
      - integration-internal

  ai:
    build:
      context: .
      dockerfile: apps/ai/Dockerfile
      target: runtime
    environment:
      NULLNULL_ENV: staging
      NULLNULL_AI_BIND_HOST: 0.0.0.0
      NULLNULL_AI_PORT: "8090"
      NULLNULL_CATALOG_VERSION: catalog-integration-fixture
      AI_PROVIDER: NONE
    healthcheck:
      # The runtime image has no curl; the pinned python:3.13-slim standard library is enough.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/internal/v1/health/ready', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - integration-internal

  # integration-internal is internal: true, so published ports are unreachable from the host;
  # scripts/integration-test.sh probes api and web readiness from inside the network instead.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      <<: *api-environment
      # The catalog gate is opened here and only here (#253): the E2E drives trips and the feed,
      # which are 503 while it is closed. api-quality keeps the default (closed) because the
      # *FailsClosedIT suites prove that state. No cursor secret is needed: SPRING_PROFILES_ACTIVE
      # is `integration` alone, a development profile, so CatalogPublicationProperties signs with
      # an ephemeral key.
      NULLNULL_CATALOG_PUBLIC_ENABLED: "true"
      # The other key that cannot be shared with api-quality. CsrfOriginInterceptor
      # compares the request's Origin against this value on every non-GET, so it
      # has to name the origin the caller actually loads from — and the two
      # callers differ. api-quality drives MockMvc, whose tests write
      # "http://localhost:5173" as a literal in 124 places, so the anchor keeps
      # that; here the caller is a real browser served by `web`.
      #
      # It says localhost rather than web because of what the BROWSER does with
      # the name, not what resolves. A real Chromium was pointed at ONE server
      # under three names (--host-resolver-rules mapped all three to the same
      # loopback, so only the name differed):
      #   http://localhost:<p>  Secure/__Host- cookie kept
      #   http://127.0.0.1:<p>  kept
      #   http://web:<p>        DROPPED
      # localhost and 127.0.0.1 are potentially-trustworthy origins, so a Secure
      # cookie survives plain HTTP there; `web` is not. An earlier version of
      # this override said web:4173 and fixed the CSRF rejection but not the
      # cookie, so the session still died at the first request after bootstrap.
      # Reaching localhost is what `network_mode: service:web` on the e2e
      # service below buys, and it is why these two must land together.
      APP_PUBLIC_ORIGIN: http://localhost:4173
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - integration-internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    environment:
      API_INTERNAL_BASE_URL: http://api:8080
    depends_on:
      - api
    networks:
      - integration-internal

  e2e:
    profiles: [quality]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: e2e
    environment:
      PLAYWRIGHT_BASE_URL: http://localhost:4173
      API_INTERNAL_BASE_URL: http://api:8080
      CI: "true"
    depends_on:
      - api
      - web
    volumes:
      - ./.artifacts/integration/playwright:/workspace/apps/web/playwright-report
      - ./.artifacts/integration/test-results:/workspace/apps/web/test-results
    command: ["npm", "run", "test:e2e:integration"]
    # The browser must load from an origin it considers trustworthy or it silently drops the
    # Secure/__Host- session cookie, and every request after bootstrap is a 401 with no cookie
    # (#233). Measured with a real Chromium against ONE server under three names:
    #   http://localhost:<p>  kept   http://127.0.0.1:<p>  kept   http://web:<p>  dropped
    # Sharing web's network namespace lets the browser use localhost without TLS and without
    # lowering APP_COOKIE_SECURE - which SessionProperties:34, SessionPropertiesTest and
    # ENVIRONMENT.md all pin, and which would also change the cookie NAME the gate exercises
    # (SessionProperties:56), so the E2E would stop testing the cookie production ships.
    network_mode: service:web

  egress-denied:
    profiles: [quality]
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if curl --fail --silent --show-error --connect-timeout 3 \
          --max-time 5 https://example.com/ >/dev/null; then
          echo "External network unexpectedly reachable from integration network." >&2
          exit 1
        fi
        echo "outbound_network=denied"
    networks:
      - integration-internal

networks:
  integration-internal:
    internal: true

# Image digests are pinned (verify_target_stack.py rejects tags). The api side of the
# B01 contract is in place; apps/web stages, root quality scripts and the
# .nullnull-target-stack marker still land with the web scaffold, and until then
# scripts/integration-test.sh intentionally does not parse this compose file.

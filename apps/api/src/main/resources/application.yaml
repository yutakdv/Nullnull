spring:
  application:
    name: nullnull-api
  profiles:
    default: local
  mvc:
    servlet:
      path: /api/v1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  datasource:
    hikari:
      maximum-pool-size: ${NULLNULL_DB_POOL_MAX:10}
      connection-timeout: 5000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

nullnull:
  env: ${NULLNULL_ENV:local}
  readiness:
    database-timeout-seconds: 2
  # Replay record retention and lock wait bound (docs/operations/ENVIRONMENT.md
  # APP_IDEMPOTENCY_TTL, APP_IDEMPOTENCY_LOCK_TIMEOUT). ISO-8601 durations: a bare number would be
  # read as milliseconds, so both values have a startup floor in IdempotencyGuard.
  idempotency:
    ttl: ${APP_IDEMPOTENCY_TTL:PT24H}
    lock-timeout: ${APP_IDEMPOTENCY_LOCK_TIMEOUT:PT3S}
  # Recommendation service (apps/ai). No default host: a missing base URL fails startup.
  ai:
    base-url: ${NULLNULL_AI_BASE_URL}
    connect-timeout: ${NULLNULL_AI_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${NULLNULL_AI_READ_TIMEOUT:PT5S}

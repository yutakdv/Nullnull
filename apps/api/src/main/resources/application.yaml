spring:
  application:
    name: nullnull-api
  profiles:
    default: local
  mvc:
    servlet:
      path: /api/v1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      # docs/api/openapi.yaml declares additionalProperties: false on every request schema and
      # x-nullnull-common-contract.bounds promises "Unknown object fields are rejected". Jackson's own
      # default (and Spring Boot's) is to drop them silently, which made the contract, the code and the
      # 400 detail ("contains unsupported fields") disagree. This is what makes the promise real; the
      # refusal arrives as HttpMessageNotReadableException and GlobalExceptionHandler answers 400
      # INVALID_REQUEST with a fixed sentence that never repeats the offending field or its value.
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  datasource:
    hikari:
      # 10 was sized for one job type. BA-050 adds a second, and JobConnectionBudget's worst case
      # (2 * slots + types + 1, plus 2 reserved for readiness) makes the demand 9 for the two types
      # at their configured concurrency - so the default rises with the work rather than the guard
      # being loosened to fit it. Raising it again is how a third type is admitted; lowering a type's
      # nullnull.jobs.concurrency.<type> is the other lever, and both are named in the failure.
      maximum-pool-size: ${NULLNULL_DB_POOL_MAX:12}
      connection-timeout: 5000

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # The swallow budget for a request body the application already REFUSED. Tomcat has to read the
    # unsent remainder to keep the connection usable; past this many bytes it stops reading and
    # drops the connection. A caller may receive 413 before that close or see a transport error.
    # Both regimes are documented in docs/operations/ENVIRONMENT.md §3 (APP_MAX_REQUEST_BODY_BYTES).
    # A raw-socket integration test keeps uploading independently of the received response.
    # 2097152 = 8 x the accepted bound 262144 (APP_MAX_REQUEST_BODY_BYTES). It is EXACTLY Tomcat's own
    # default, so removing this line changes no behaviour and no test can tell the two apart. It is
    # written out anyway to make the boundary between the two regimes an explicit, documented choice
    # that moves with the bound, rather than a default nobody looked at. Unlimited (-1) is refused on
    # purpose: reading an unbounded body that was already rejected is a denial-of-service path.
    max-swallow-size: 2097152
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    # Tomcat writes a Cookie pair it cannot parse to the log verbatim, at INFO the first time and DEBUG after
    # (http/parser/Cookie.logInvalidHeader). The pair can hold a live session token - "name=<token> junk", or
    # a folded "a=1, name=<token>" - and cookies never go into logs. Its UserDataHelper asks isInfoEnabled /
    # isDebugEnabled before building the message, so WARN silences both. CookieParserLogRedactionIT pins it.
    org.apache.tomcat.util.http.parser: WARN
    # A datasource URL may carry credentials (?password=..., ?sslpassword=...), and four loggers write the URL
    # down as it is. DatasourceUrlLogRedactionIT pins each one with a canary.
    # - Hibernate's HHH10001005 "Database info" block prints "Database JDBC URL [...]" at INFO on every start.
    #   WARN drops that block (driver, dialect, version, pool) and HHH10001013 "Ignoring setting", which only
    #   hibernate.connection.* settings this application does not set would trigger.
    # - Flyway's "Database: <url>" line masks password= only up to the first ';' and not sslpassword= at all,
    #   and it also prints the host, which docs/operations/ENVIRONMENT.md keeps out of logs. WARN drops that
    #   line and two sign-in/community notices; migration progress comes from other Flyway classes.
    # - The PostgreSQL driver echoes a URL it rejects (a missing or extra '/', a user:password@ where the port
    #   goes) at WARNING, password included. ERROR also drops its other warnings: a missing pg_service entry, an
    #   unparsable loginTimeout, a port outside 1-65535, host=/port= lists of different lengths.
    # Not closed by a level: the pool's own refusal of such a URL, in the startup failure, masks password=
    # parameters only, so a user:password@ URL appears there whole, and a connection failure names host:port.
    # Refusing credentials in the URL is what would close that.
    org.hibernate.orm.connections.pooling: WARN
    org.flywaydb.core.FlywayExecutor: WARN
    org.postgresql.Driver: ERROR
    org.postgresql.util.PGPropertyUtil: ERROR
  pattern:
    # Puts the MDC requestId that RequestIdFilter sets into every log line. Without it the id existed
    # in MDC and in the response header but appeared in no log line, so "quote your request id to
    # support" had nothing to look up. LOG_CORRELATION_PATTERN is the slot Spring Boot's own default
    # console/file patterns already carry, so this adds the field without restating either pattern and
    # without a structured-logging encoder or a new dependency.
    correlation: "[${spring.application.name:},%X{requestId:-}] "

nullnull:
  analytics:
    # ERD §6 retention for client analytics events. Not configurable down to zero: a zero would
    # delete every row on the next sweep, which reads like a policy and is usually an unset value.
    retention: ${NULLNULL_ANALYTICS_RETENTION:P90D}
  # P1 notification centre (BA-085). Default OFF, so the submission build serves no notification
  # surface: the three operations refuse while it is off. This is NOT a nullnull.capabilities.* flag
  # - that vocabulary is pinned to live/replay/optimization and publishing a fourth through
  # getDemoReadiness is a FE-facing contract change owned by BA-003.
  #
  # The two retentions are ERD §6's "90 days, or 30 days after it was read, whichever is earlier".
  # They are ISO-8601 durations and floored in NotificationService, because a zero reads like a
  # policy and is almost always an unset value.
  notifications:
    enabled: ${FEATURE_NOTIFICATIONS:false}
    retention: ${NULLNULL_NOTIFICATION_RETENTION:P90D}
    read-retention: ${NULLNULL_NOTIFICATION_READ_RETENTION:P30D}
  crowd:
    max-range-days: ${NULLNULL_CROWD_MAX_RANGE_DAYS:30}
  env: ${NULLNULL_ENV:local}
  # C3 place reads remain unavailable unless the final staging provenance gate is evidenced and the
  # release operator explicitly enables this runtime flag. Local tests opt in per test context.
  catalog:
    public-enabled: ${NULLNULL_CATALOG_PUBLIC_ENABLED:false}
  live:
    # Only the staging API service opts in. Each replica ticks locally, while V048 admits one
    # database claim per reviewed area every five minutes across all replicas.
    schedule-enabled: ${NULLNULL_LIVE_SCHEDULE_ENABLED:false}
  readiness:
    database-timeout-seconds: 2
  http:
    # Engineering proposal, derived in docs/operations/ENVIRONMENT.md §3 from the largest documented
    # input in docs/api/README.md §14 (a 20,000 character paste). Both a declared Content-Length over
    # the bound and a chunked body that passes it while streaming are refused with 413.
    max-request-body-bytes: ${APP_MAX_REQUEST_BODY_BYTES:262144}
    access-log:
      # The documented default. AccessLogFilter refuses to start with this ON in production.
      include-query: ${APP_ACCESS_LOG_INCLUDE_QUERY:false}
  # Product capability flags (docs/operations/ENVIRONMENT.md §6), published by getDemoReadiness. replay may
  # only turn a feature OFF: it has no server-side source yet, so an ON value fails startup instead of
  # advertising something nothing can answer. optimization has one (BA-050, BA-051) and live has one as of
  # B10 (V046's promoted source, the Seoul collector's writer, queryLiveAreas); both may be ON. The
  # defaults stay OFF - having a source is what makes ON permissible, not what makes it chosen.
  capabilities:
    live: ${FEATURE_LIVE_DATA:false}
    replay: ${FEATURE_REPLAY_MODE:false}
    optimization: ${FEATURE_OPTIMIZATION_ITEM:false}
  # Replay record retention and lock wait bound (docs/operations/ENVIRONMENT.md
  # APP_IDEMPOTENCY_TTL, APP_IDEMPOTENCY_LOCK_TIMEOUT). ISO-8601 durations: a bare number would be
  # read as milliseconds, so both values have a startup floor in IdempotencyGuard.
  idempotency:
    ttl: ${APP_IDEMPOTENCY_TTL:PT24H}
    lock-timeout: ${APP_IDEMPOTENCY_LOCK_TIMEOUT:PT3S}
  deletion:
    status-token-ttl: ${APP_DELETION_STATUS_TOKEN_TTL:P7D}
    tombstone-retention: ${APP_DELETION_TOMBSTONE_RETENTION:P21D}
    retry-limit: ${APP_DELETION_RETRY_LIMIT:5}
  # Leased background job runtime (docs/operations/ENVIRONMENT.md NULLNULL_JOB_*, card BA-005).
  # Every value below is an engineering proposal, not a documented contract figure. The durations are
  # ISO-8601 and floored in JobProperties, because a bare number is read as milliseconds:
  # NULLNULL_JOB_LEASE=60 would be a 60 millisecond lease and every job would be re-taken forever.
  # enabled=false stops polling AND the retention sweep, so only a test or maintenance run sets it.
  jobs:
    enabled: ${NULLNULL_JOBS_ENABLED:true}
    lease: ${NULLNULL_JOB_LEASE:PT60S}
    poll-interval: ${NULLNULL_JOB_POLL_INTERVAL:PT1S}
    lock-timeout: ${NULLNULL_JOB_LOCK_TIMEOUT:PT3S}
    max-attempts: ${NULLNULL_JOB_MAX_ATTEMPTS:5}
    retry-backoff: ${NULLNULL_JOB_RETRY_BACKOFF:PT10S}
    max-retry-backoff: ${NULLNULL_JOB_MAX_RETRY_BACKOFF:PT5M}
    dead-letter-window: ${NULLNULL_JOB_DEAD_LETTER_WINDOW:PT15M}
    finished-retention: ${NULLNULL_JOB_FINISHED_RETENTION:P7D}
    retention-sweep-interval: ${NULLNULL_JOB_RETENTION_SWEEP_INTERVAL:PT1M}
    default-concurrency: ${NULLNULL_JOB_DEFAULT_CONCURRENCY:2}
    concurrency:
      # One optimization run at a time per task. A run is one visitor waiting for one preview, so a
      # second slot would buy throughput nobody is asking for while taking two more connections out
      # of the pool the readiness probe shares.
      optimize-item: ${NULLNULL_JOB_CONCURRENCY_OPTIMIZE_ITEM:1}
  # Recommendation service (apps/ai). No default host: a missing base URL fails startup.
  ai:
    base-url: ${NULLNULL_AI_BASE_URL}
    connect-timeout: ${NULLNULL_AI_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${NULLNULL_AI_READ_TIMEOUT:PT5S}
  # BA-082 post image uploads (A-057 file input, A-058 automatic validation).
  #
  # THE CEILINGS ARE DERIVED, NOT PICKED. They live here rather than in V045 for the reason V037
  # gives about its own derivation: an applied migration cannot be edited, so a ceiling written
  # into one could never be raised.
  #
  # Derivation: the largest image this project actually ships, rounded up to the next power of two.
  # Measured on docs/contest/covers (5 cover images, 2026-09-20):
  #   largest file      2,830,569 B   (02-changdeokgung)
  #   largest long edge 1,312 px      (04-deoksugung, 05-seoulsup)
  # A ceiling below those would mean we could not upload our own covers, which is the test any
  # replacement number has to pass. Re-measure the directory and round up the same way.
  upload:
    max-bytes: ${NULLNULL_UPLOAD_MAX_BYTES:4194304}
    max-long-edge-pixels: ${NULLNULL_UPLOAD_MAX_LONG_EDGE_PIXELS:2048}
    # The two the contract accepts. V045's CHECK and ImageFormat hold the same two; all three move
    # together. webp is absent because this JDK has no webp reader or writer and EXIF is removed by
    # re-encoding - see ImageFormat's javadoc for the measurement.
    content-types: ${NULLNULL_UPLOAD_CONTENT_TYPES:image/jpeg,image/png}
    # How long a signed URL stays usable. Bounded above by the idempotency key retention (24h) so an
    # intent cannot outlive the record that makes its consumption replay-safe, and below by the time
    # the upload itself takes. ASSUMED, NOT MEASURED: 4 MiB over a 1 Mbps uplink is about 34 seconds,
    # so minutes - not seconds - is the right order, with room for one retry on the same URL.
    presign-ttl: ${NULLNULL_UPLOAD_PRESIGN_TTL:PT15M}
  # External provider calls use an isolated bounded executor, exact host allowlists and no redirects.
  provider:
    connect-timeout: ${NULLNULL_PROVIDER_CONNECT_TIMEOUT:PT2S}
    request-timeout: ${NULLNULL_PROVIDER_REQUEST_TIMEOUT:PT5S}
    max-response-bytes: ${NULLNULL_PROVIDER_MAX_RESPONSE_BYTES:2097152}
    executor-threads: ${NULLNULL_PROVIDER_EXECUTOR_THREADS:8}
    executor-queue-capacity: ${NULLNULL_PROVIDER_EXECUTOR_QUEUE_CAPACITY:32}
    per-source-concurrency: ${NULLNULL_PROVIDER_PER_SOURCE_CONCURRENCY:4}
    retry:
      attempts: ${NULLNULL_PROVIDER_RETRY_ATTEMPTS:3}
      base-delay: ${NULLNULL_PROVIDER_RETRY_BASE_DELAY:PT0.1S}
      max-delay: ${NULLNULL_PROVIDER_RETRY_MAX_DELAY:PT2S}
    circuit:
      failure-threshold: ${NULLNULL_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:5}
      failure-window: ${NULLNULL_PROVIDER_CIRCUIT_FAILURE_WINDOW:PT30S}
      open-duration: ${NULLNULL_PROVIDER_CIRCUIT_OPEN_DURATION:PT60S}
  sources:
    KTO_KOR_SERVICE_2:
      allowed-hosts: ["${KTO_ALLOWED_HOST:apis.data.go.kr}"]
    KTO_CONCENTRATION_FORECAST:
      allowed-hosts: ["${KTO_ALLOWED_HOST:apis.data.go.kr}"]
    KTO_RELATED_PLACES:
      allowed-hosts: ["${KTO_ALLOWED_HOST:apis.data.go.kr}"]
    # A-051 fixed the provider and a live call on 2026-09-20 confirmed this host answers.
    # Naming the product and the operation, not just "Kakao": Kakao Map is a different
    # product on a different host with its own terms and quota, and route optimization is
    # Kakao Mobility only. This entry must stay identical to ProviderHostPolicy
    # PRODUCTION_HOSTS - production start-up compares the two maps for exact equality and
    # no gate runs as production, so a change to one of them alone is green everywhere.
    KAKAO_MOBILITY_DIRECTIONS:
      allowed-hosts: ["${KAKAO_ROUTE_ALLOWED_HOST:apis-navi.kakaomobility.com}"]
    SEOUL_CITYDATA:
      # THIS DEFAULT IS WRONG ONCE THE PROXY EXISTS and must become the proxy host: with the provider's
      # own name here, a proxy-shaped request (no key in the path) would be sent straight to Seoul, and
      # what that returns is not something we can predict. It is not emptied yet because
      # SourceProviderProperties rejects a host that is not a bare hostname, so an empty default fails
      # startup for every context in the repository - including the ones that never touch this source.
      # The change belongs in the commit that knows the proxy's name.
      allowed-hosts: ["${SEOUL_ALLOWED_HOST:openapi.seoul.go.kr}"]
  # C2 uses only KorService2/detailCommon2. There is intentionally no default URL or key: PR/local
  # fixtures remain loopback-only, while the contest profile refuses to start without an explicit
  # official endpoint and a runtime-only data.go.kr decoding key.
  # Seoul live areas are reached through a proxy we run, never directly: the provider is plain HTTP on
  # port 8088 with the key in the URL path, and ProviderHttpClient refuses anything but HTTPS or
  # loopback. This side holds no Seoul key - the proxy injects it - so there is no api-key here. Both
  # values are empty by default and every call fails closed until an operator sets them.
  seoul:
    base-url: ${SEOUL_BASE_URL:}
    proxy-token: ${SEOUL_PROXY_TOKEN:}
  # Car directions only. Walking and cycling are affiliate-gated (a prior contract is
  # required), so the ETA here is a driving time and no screen may present it as a walking
  # one. The key is blank by default because route optimization is P1 with its capability
  # off: a deployment without it is the normal one, and the gateway refuses at call time.
  kakao-route:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    base-url: ${KAKAO_ROUTE_BASE_URL:https://apis-navi.kakaomobility.com}
  kto:
    service-key: ${KTO_SERVICE_KEY:}
    base-url: ${KTO_BASE_URL:}
    forecast-base-url: ${KTO_FORECAST_BASE_URL:}
    mobile-app: ${KTO_MOBILE_APP:Nullnull}
    mobile-os: ${KTO_MOBILE_OS:ETC}
    release-version: ${APP_RELEASE_VERSION:local-unreleased}
    contest-profile: ${APP_CONTEST_PROFILE:NONE}

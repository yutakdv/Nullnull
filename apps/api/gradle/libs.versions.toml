# Exact versions locked for B01 (BA-001). Change only through a dependency PR
# that re-runs test, integrationTest, openapiContractTest and recommendationTest.
[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
archunit = "1.5.0"
json-schema-validator = "3.0.7"
# BA-082: the object store an uploaded cover passes through. Pinned like the rest - the
# presigner alone is pure computation (SigV4 is an HMAC over a canonical request), which is why a
# gate with egress denied can still exercise the signing path.
aws-sdk = "2.35.9"

[libraries]
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

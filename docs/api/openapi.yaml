    CrowdMetric:
      type: object
      additionalProperties: false
      required: [state, label, provenance]
      properties:
        state:
          $ref: "#/components/schemas/SourceState"
        value:
          type: [number, "null"]
        unit:
          type: [string, "null"]
        ordinalLevel:
          type: [string, "null"]
        label:
          type: string
          description: |
            Server-side name of the metric, in the source's own language. It is diagnostic, not display
            copy: it is not localized and it is not the approved attribution. Build user-facing wording
            from `state` and `provenance.metricDefinition`, and display `provenance.attribution` verbatim
            for the credit.
        provenance:
          $ref: "#/components/schemas/DataProvenance"
    CrowdSeries:
      type: object
      additionalProperties: false
      required: [placeId, state, points]
      properties:
        placeId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/SourceState"
        points:
          type: array
          items:
            $ref: "#/components/schemas/CrowdMetric"
        unavailableReason:
          type: [string, "null"]
    RelationState:
      type: string
      enum: [EXACT, SIMILAR, NONE, CHECKING, UNKNOWN]
    RelatedPlaceResult:
      type: object
      additionalProperties: false
      required: [sourcePlaceId, state, items]
      properties:
        sourcePlaceId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/RelationState"
        reason:
          type: [string, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelatedPlace"
    RelatedPlace:
      type: object
      additionalProperties: false
      required: [place, relation, relationReason, provenance]
      properties:
        place:
          $ref: "#/components/schemas/PlaceSummary"
        relation:
          type: string
          enum: [EXACT, SIMILAR]
        relationReason:
          type: string
        crowd:
          oneOf:
            - $ref: "#/components/schemas/CrowdMetric"
            - type: "null"
        provenance:
          $ref: "#/components/schemas/DataProvenance"

    TripStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    PlanningLevel:
      type: string
      enum: [NOTHING, MUST_VISIT_ONLY, MOSTLY_PLANNED]
    TripSummary:
      type: object
      additionalProperties: false
      required: [id, title, startDate, endDate, timezone, status, version, candidateCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        timezone:
          type: string
        status:
          $ref: "#/components/schemas/TripStatus"
        version:
          type: integer
          format: int64
          minimum: 1
        candidateCount:
          type: integer
          minimum: 0
    TripPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TripSummary"
        page:
          $ref: "#/components/schemas/CursorPage"
    TripDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - startDate
        - endDate
        - timezone
        - status
        - version
        - candidateCount
        - planningLevel
        - interests
        - days
        - candidates
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: "#/components/schemas/TripStatus"
        version:
          type: integer
          format: int64
          minimum: 1
        candidateCount:
          type: integer
          minimum: 0
          maximum: 500
          description: |
            How many candidates the trip holds. This is the number to display; it is not
            `candidates.length`, which may be smaller. Which statuses are counted is decided by the
            candidate slice and is not fixed here yet, so do not derive a per-status breakdown from it.
        planningLevel:
          $ref: "#/components/schemas/PlanningLevel"
        interests:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TripInterest"
        days:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/TripDay"
        candidates:
          type: array
          maxItems: 500
          description: |
            A bounded view of the trip's candidates, not guaranteed to be the whole set: it may hold
            fewer entries than `candidateCount`, including none while the count is positive. The
            paginated source is `listTripCandidates`, which also filters by status. Never treat this
            array's length as the total, and refetch through that operation rather than assuming a
            mutation here kept the array complete.
          items:
            $ref: "#/components/schemas/TripCandidate"
    TripInterest:
      type: object
      additionalProperties: false
      required: [code, weight]
      properties:
        code:
          type: string
        weight:
          type: integer
          minimum: 1
          maximum: 5
    TripDay:
      type: object
      additionalProperties: false
      required: [date, items]
      properties:
        date:
          type: string
          format: date
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TripItem"
    TripItem:
      type: object
      additionalProperties: false
      required: [id, place, date, position, constraints]
      properties:
        id:
          type: string
          format: uuid
        place:
          $ref: "#/components/schemas/PlaceSummary"
        date:
          type: string
          format: date
        position:
          type: integer
          minimum: 0
        startTime:
          type: [string, "null"]
          format: time
        durationMinutes:
          type: [integer, "null"]
          minimum: 1
        note:
          type: [string, "null"]
          maxLength: 500
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/TripConstraint"
        crowd:
          oneOf:
            - $ref: "#/components/schemas/CrowdMetric"
            - type: "null"
    ConstraintType:
      type: string
      enum: [MUST_VISIT, DATE, TIME, RESERVATION]
    TripConstraint:
      oneOf:
        - $ref: "#/components/schemas/MustVisitConstraint"
        - $ref: "#/components/schemas/DateConstraint"
        - $ref: "#/components/schemas/TimeConstraint"
        - $ref: "#/components/schemas/ReservationConstraint"
      discriminator:
        propertyName: type
        mapping:
          MUST_VISIT: "#/components/schemas/MustVisitConstraint"
          DATE: "#/components/schemas/DateConstraint"
          TIME: "#/components/schemas/TimeConstraint"
          RESERVATION: "#/components/schemas/ReservationConstraint"
    MustVisitConstraint:
      type: object
      additionalProperties: false
      required: [type, locked, source]
      properties:
        type:
          type: string
          const: MUST_VISIT
        locked:
          type: boolean
          const: true
        source:
          type: string
          enum: [USER, IMPORT]
    DateConstraint:
      type: object
      additionalProperties: false
      required: [type, locked, source, date]
      properties:
        type:
          type: string
          const: DATE
        locked:
          type: boolean
          const: true
        source:
          type: string
          enum: [USER, IMPORT]
        date:
          type: string
          format: date
    TimeConstraint:
      type: object
      additionalProperties: false
      required: [type, locked, source, startTime, toleranceMinutes]
      properties:
        type:
          type: string
          const: TIME
        locked:
          type: boolean
          const: true
        source:
          type: string
          enum: [USER, IMPORT]
        startTime:
          type: string
          format: time
        toleranceMinutes:
          type: integer
          minimum: 0
          maximum: 180
    ReservationConstraint:
      type: object
      additionalProperties: false
      required: [type, locked, source, date, startTime]
      properties:
        type:
          type: string
          const: RESERVATION
        locked:
          type: boolean
          const: true
        source:
          type: string
          enum: [USER, IMPORT]
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: [string, "null"]
          format: time
    CreateTripRequest:
      type: object
      additionalProperties: false
      required: [startDate, endDate, timezone, planningLevel, interests]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional user title. When omitted, the server creates a deterministic locale-aware default (새 여행/New trip); it never asks an LLM to invent one.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Inclusive; server rejects ranges longer than 30 calendar days.
        timezone:
          type: string
          default: Asia/Seoul
        planningLevel:
          $ref: "#/components/schemas/PlanningLevel"
        interests:
          type: array
          minItems: 0
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TripInterest"
        seedItems:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SeedTripItem"
    SeedTripItem:
      type: object
      additionalProperties: false
      required: [placeId, date, position]
      properties:
        placeId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        position:
          type: integer
          minimum: 0
        startTime:
          type: [string, "null"]
          format: time
        constraints:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SetConstraintInput"
    UpdateTripRequest:
      type: object
      additionalProperties: false
      description: Date-range shrink is rejected with VALIDATION_FAILED while any item or DATE/RESERVATION lock lies outside the new range.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          description: IANA timezone. Existing local dates and wall-clock times are preserved; the server revalidates derived instants and rejects conflicts instead of silently moving items.
        planningLevel:
          $ref: "#/components/schemas/PlanningLevel"
        status:

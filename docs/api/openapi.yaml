      tags: [Optimizations]
      operationId: listOptimizationHistory
      summary: List the current owner's optimization history
      description: |
        P0 profile history. Results are newest-first and contain status, timestamps, target trip,
        and run link only. This view never returns or causes a duplicate itinerary snapshot.
      x-release: P0
      security:

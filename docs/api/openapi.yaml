      properties:
        replacementPlaceId:
          type: string
          format: uuid
        relationId:
          type: [string, "null"]
          format: uuid
        preserveDateTime:
          type: boolean
          default: true
    SetConstraintInput:
      oneOf:
        - $ref: "#/components/schemas/SetMustVisitConstraintInput"
        - $ref: "#/components/schemas/SetDateConstraintInput"
        - $ref: "#/components/schemas/SetTimeConstraintInput"
        - $ref: "#/components/schemas/SetReservationConstraintInput"
      discriminator:
        propertyName: type
        mapping:
          MUST_VISIT: "#/components/schemas/SetMustVisitConstraintInput"
          DATE: "#/components/schemas/SetDateConstraintInput"
          TIME: "#/components/schemas/SetTimeConstraintInput"
          RESERVATION: "#/components/schemas/SetReservationConstraintInput"
    SetMustVisitConstraintInput:
      type: object
      additionalProperties: false
      required: [type, locked]
      properties:
        type:
          type: string
          const: MUST_VISIT
        locked:
          type: boolean
          const: true
    SetDateConstraintInput:
      type: object
      additionalProperties: false
      required: [type, locked, date]
      properties:
        type:
          type: string
          const: DATE
        locked:
          type: boolean
          const: true
        date:
          type: string
          format: date
    SetTimeConstraintInput:
      type: object
      additionalProperties: false
      required: [type, locked, startTime, toleranceMinutes]
      properties:
        type:
          type: string
          const: TIME
        locked:
          type: boolean
          const: true
        startTime:
          type: string
          format: time
        toleranceMinutes:
          type: integer
          minimum: 0
          maximum: 180
    SetReservationConstraintInput:
      type: object
      additionalProperties: false
      required: [type, locked, date, startTime]
      properties:
        type:
          type: string
          const: RESERVATION
        locked:
          type: boolean
          const: true
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: [string, "null"]
          format: time
    SetConstraintRequest:
      $ref: "#/components/schemas/SetConstraintInput"
    TripMutationResult:
      type: object
      additionalProperties: false
      required: [trip, changedItemIds]
      properties:
        trip:
          $ref: "#/components/schemas/TripDetail"
        changedItemIds:
          type: array
          items:
            type: string
            format: uuid

    OptimizationScope:
      type: string
      enum: [ITEM, DAY, TRIP]
    OptimizationStatus:
      type: string
      enum: [QUEUED, RUNNING, READY, APPLIED, KEPT, REVERTED, FAILED, EXPIRED]
    CreateOptimizationRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateItemOptimizationRequest"
        - $ref: "#/components/schemas/CreateDayOptimizationRequest"
        - $ref: "#/components/schemas/CreateTripOptimizationRequest"
      discriminator:
        propertyName: scope
        mapping:
          ITEM: "#/components/schemas/CreateItemOptimizationRequest"
          DAY: "#/components/schemas/CreateDayOptimizationRequest"
          TRIP: "#/components/schemas/CreateTripOptimizationRequest"
    CreateItemOptimizationRequest:
      type: object
      additionalProperties: false
      required: [scope, targetItemId, inputTripVersion, includeCandidates]
      properties:
        scope:
          type: string
          const: ITEM
        targetItemId:
          type: string
          format: uuid
        inputTripVersion:
          type: integer
          format: int64
          minimum: 1
        includeCandidates:
          type: boolean
          default: false
        objective:
          type: string
          enum: [REDUCE_CROWD]
          default: REDUCE_CROWD
      examples:
        - scope: ITEM
          targetItemId: 018f3f8e-9b67-7a21-8d31-31d315b93911
          inputTripVersion: 7
          includeCandidates: false
          objective: REDUCE_CROWD
    CreateDayOptimizationRequest:
      type: object
      additionalProperties: false
      required: [scope, targetDate, inputTripVersion, includeCandidates]
      properties:
        scope:
          type: string
          const: DAY
        targetDate:
          type: string
          format: date
        inputTripVersion:
          type: integer
          format: int64
          minimum: 1
        includeCandidates:
          type: boolean
          default: false
        objective:
          type: string
          enum: [REDUCE_CROWD]
          default: REDUCE_CROWD
      examples:
        - scope: DAY
          targetDate: "2026-09-12"
          inputTripVersion: 7
          includeCandidates: false
          objective: REDUCE_CROWD
    CreateTripOptimizationRequest:
      type: object
      additionalProperties: false
      required: [scope, inputTripVersion, includeCandidates]
      properties:
        scope:
          type: string
          const: TRIP
        inputTripVersion:
          type: integer
          format: int64
          minimum: 1
        includeCandidates:
          type: boolean
          default: false
        objective:
          type: string
          enum: [REDUCE_CROWD]
          default: REDUCE_CROWD
      examples:
        - scope: TRIP
          inputTripVersion: 7
          includeCandidates: false
          objective: REDUCE_CROWD
    OptimizationRun:
      type: object
      additionalProperties: false
      required:
        - id
        - tripId
        - scope
        - status
        - inputTripVersion
        - includeCandidates
        - queuedAt
        - proposals
        - snapshotSetIds
        - decisions
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        scope:
          $ref: "#/components/schemas/OptimizationScope"
        status:
          $ref: "#/components/schemas/OptimizationStatus"
        revertAvailability:
          type: string
          enum: [AVAILABLE, EXPIRED, REVERTED, NOT_APPLICABLE]
          description: |
            Optional server-computed read projection, evaluated at response time. Precedence:
            no APPLY decision -> NOT_APPLICABLE; already reverted -> REVERTED;
            server now >= APPLY.revertUntil -> EXPIRED; current trip version differs from
            APPLY.resultingTripVersion -> NOT_APPLICABLE; otherwise -> AVAILABLE.
            Absence means unknown support, never permission to enable undo using client time.
            AVAILABLE is advisory: the mutation rechecks owner, version, window and decision.
        inputTripVersion:
          type: integer
          format: int64
        inputRevisionId:
          type: [string, "null"]
          format: uuid
        includeCandidates:
          type: boolean
        dataFingerprint:
          type: [string, "null"]
        algorithmVersion:
          type: [string, "null"]
        queuedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        proposals:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/OptimizationProposal"
        snapshotSetIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        decisions:
          type: array
          maxItems: 2
          description: Empty, one initial APPLY/KEEP, then optional one REVERT of APPLY.
          items:
            $ref: "#/components/schemas/OptimizationDecision"
        failure:
          oneOf:
            - $ref: "#/components/schemas/OptimizationFailure"
            - type: "null"
    OptimizationProposal:
      type: object
      additionalProperties: false
      required:
        - id
        - rank
        - summary
        - changes
        - metrics
        - validation
        - dataProvenance
      properties:
        id:
          type: string
          format: uuid
        rank:
          type: integer
          minimum: 1
        summary:
          type: string
          minLength: 1
          maxLength: 500
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/OptimizationChange"
        metrics:
          $ref: "#/components/schemas/OptimizationMetrics"
        validation:
          $ref: "#/components/schemas/ValidationSummary"
        dataProvenance:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DataProvenance"
    OptimizationChange:
      oneOf:
        - $ref: "#/components/schemas/OptimizationExistingItemChange"
        - $ref: "#/components/schemas/OptimizationAddChange"
        - $ref: "#/components/schemas/OptimizationRemoveChange"
      discriminator:
        propertyName: operation
        mapping:
          MOVE: "#/components/schemas/OptimizationExistingItemChange"
          REORDER: "#/components/schemas/OptimizationExistingItemChange"
          REPLACE: "#/components/schemas/OptimizationExistingItemChange"
          ADD: "#/components/schemas/OptimizationAddChange"
          REMOVE: "#/components/schemas/OptimizationRemoveChange"
    OptimizationExistingItemChange:
      type: object
      additionalProperties: false
      required: [operation, itemId, before, after]
      properties:
        operation:
          type: string
          enum: [MOVE, REORDER, REPLACE]
        itemId:
          type: string
          format: uuid
        before:
          $ref: "#/components/schemas/TripItemState"
        after:
          $ref: "#/components/schemas/TripItemState"
    OptimizationAddChange:
      type: object
      additionalProperties: false
      required: [operation, itemId, before, after]
      properties:
        operation:
          type: string
          const: ADD
        itemId:
          type: string
          format: uuid
          description: Stable prospective item ID reserved by the preview.
        before:
          type: "null"
        after:
          $ref: "#/components/schemas/TripItemState"
    OptimizationRemoveChange:
      type: object
      additionalProperties: false
      required: [operation, itemId, before, after]
      properties:
        operation:
          type: string
          const: REMOVE
        itemId:
          type: string
          format: uuid
        before:
          $ref: "#/components/schemas/TripItemState"
        after:
          type: "null"
    TripItemState:
      type: object
      additionalProperties: false
      required: [placeId, date, position]
      properties:
        placeId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        position:
          type: integer
        startTime:
          type: [string, "null"]
          format: time
        crowd:
          oneOf:
            - $ref: "#/components/schemas/CrowdMetric"
            - type: "null"
    OptimizationMetrics:
      type: object
      additionalProperties: false
      required: [comparisonEligible, crowdComparison]
      properties:
        comparisonEligible:
          type: boolean
        comparisonReasonCode:
          type: [string, "null"]
        crowdBefore:
          type: [number, "null"]
        crowdAfter:
          type: [number, "null"]
        crowdDelta:
          type: [number, "null"]
        travelMinutesDelta:
          type: [integer, "null"]
        crowdComparison:
          oneOf:
            - $ref: "#/components/schemas/CrowdComparison"
            - type: "null"
    CrowdComparison:
      type: object
      additionalProperties: false
      required:
        - comparisonId
        - axis
        - eligible
        - reasonCode
        - beforeSnapshotId
        - afterSnapshotId
        - beforeValue
        - afterValue
        - delta
      properties:
        comparisonId:
          type: string
          format: uuid
        axis:
          type: string
          enum: [TEMPORAL, SPATIAL]
        eligible:
          type: boolean
        reasonCode:
          type: string
          maxLength: 100
        beforeSnapshotId:
          type: [string, "null"]
          format: uuid
        afterSnapshotId:
          type: [string, "null"]
          format: uuid
        beforeValue:
          type: [number, "null"]
        afterValue:
          type: [number, "null"]
        delta:
          type: [number, "null"]
          description: Must be null whenever eligible is false.
    ValidationSummary:
      type: object
      additionalProperties: false
      required: [allConstraintsPreserved, checks]
      properties:
        allConstraintsPreserved:
          type: boolean
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [constraintType, passed]
            properties:
              constraintType:
                $ref: "#/components/schemas/ConstraintType"
              itemId:
                type: [string, "null"]
                format: uuid
              passed:
                type: boolean
              detail:
                type: [string, "null"]
    OptimizationFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [TRIP_CHANGED, DATA_CHANGED, LOCK_CONFLICT, ROUTE_UNAVAILABLE, NO_IMPROVEMENT, APPLY_FAILED]
        message:
          type: string
        retryable:
          type: boolean
    OptimizationDecisionRequest:
      type: object
      additionalProperties: false
      required: [proposalId, decision]
      properties:
        proposalId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [APPLY, KEEP]
    InitialOptimizationDecision:
      description: Response of decideOptimization; REVERT is returned only by the revert endpoint.
      oneOf:
        - $ref: "#/components/schemas/ApplyOptimizationDecision"
        - $ref: "#/components/schemas/KeepOptimizationDecision"
      discriminator:
        propertyName: decision
        mapping:
          APPLY: "#/components/schemas/ApplyOptimizationDecision"
          KEEP: "#/components/schemas/KeepOptimizationDecision"
    OptimizationDecision:
      oneOf:
        - $ref: "#/components/schemas/ApplyOptimizationDecision"
        - $ref: "#/components/schemas/KeepOptimizationDecision"
        - $ref: "#/components/schemas/RevertOptimizationDecision"
      discriminator:
        propertyName: decision
        mapping:
          APPLY: "#/components/schemas/ApplyOptimizationDecision"
          KEEP: "#/components/schemas/KeepOptimizationDecision"
          REVERT: "#/components/schemas/RevertOptimizationDecision"
    ApplyOptimizationDecision:
      type: object
      additionalProperties: false
      required:
        - id
        - runId
        - proposalId
        - decision
        - resultingTripVersion
        - beforeRevisionId
        - afterRevisionId
        - revertUntil
        - decidedAt
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        proposalId:
          type: string
          format: uuid
        decision:
          type: string
          const: APPLY
        resultingTripVersion:
          type: integer
          format: int64
        beforeRevisionId:
          type: string
          format: uuid
        afterRevisionId:
          type: string
          format: uuid
        revertUntil:
          type: string
          format: date-time
          description: Exactly 24 hours after decidedAt; the server clock is authoritative.
        decidedAt:
          type: string
          format: date-time
      examples:
        - id: 018f3f8e-9b67-7a21-8d31-31d315b93921
          runId: 018f3f8e-9b67-7a21-8d31-31d315b93922
          proposalId: 018f3f8e-9b67-7a21-8d31-31d315b93923
          decision: APPLY
          resultingTripVersion: 8
          beforeRevisionId: 018f3f8e-9b67-7a21-8d31-31d315b93924
          afterRevisionId: 018f3f8e-9b67-7a21-8d31-31d315b93925
          revertUntil: "2026-09-07T06:00:00Z"
          decidedAt: "2026-09-06T06:00:00Z"
    KeepOptimizationDecision:
      type: object
      additionalProperties: false
      required: [id, runId, proposalId, decision, decidedAt]
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        proposalId:
          type: string
          format: uuid
        decision:
          type: string
          const: KEEP
        decidedAt:
          type: string
          format: date-time
      examples:
        - id: 018f3f8e-9b67-7a21-8d31-31d315b93931
          runId: 018f3f8e-9b67-7a21-8d31-31d315b93922
          proposalId: 018f3f8e-9b67-7a21-8d31-31d315b93923
          decision: KEEP
          decidedAt: "2026-09-06T06:00:00Z"
    RevertOptimizationDecision:
      type: object
      additionalProperties: false
      required:
        - id
        - runId
        - proposalId
        - decision
        - resultingTripVersion
        - beforeRevisionId
        - afterRevisionId
        - revertedDecisionId
        - decidedAt

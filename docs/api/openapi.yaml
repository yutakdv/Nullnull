          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ClientEvent"
    ClientEvent:
      type: object
      additionalProperties: false
      required: [eventId, name, occurredAt, context, properties]
      properties:
        eventId:
          type: string
          format: uuid
        name:
          type: string
          enum:
            - onboarding_completed
            - trip_created
            - candidate_save_started
            - candidate_saved
            - candidate_duplicate
            - candidate_save_failed
            - candidate_scheduled
            - trip_item_edited
            - optimization_requested
            - optimization_previewed
            - optimization_applied
            - optimization_kept
            - optimization_reverted
            - optimization_failed
            - live_place_opened
            - related_place_opened
            - data_guide_opened
        occurredAt:
          type: string
          format: date-time
        context:
          type: object
          additionalProperties: false
          required: [locale, timezone, route]
          description: Owner and demo session identifiers are bound server-side from the authenticated cookie.
          properties:
            locale:
              type: string
              minLength: 2
              maxLength: 35
            timezone:
              type: string
              minLength: 1
              maxLength: 100
            route:
              type: string
              maxLength: 200
              enum:
                - /
                - /language
                - /intro
                - /start
                - /feed
                - /posts/:postId
                - /trip/:tripId
                - /trip/:tripId/optimizations/:runId
                - /live
                - /profile
                - /about-data
                - /search
                - /notifications
                - /nearby/:poiId
                - /posts/new
              description: Route template only; no query string, fragment, search text, or identifier values.
            appVersion:
              type: [string, "null"]
        properties:
          type: object
          additionalProperties: true
          description: Validated again with docs/contracts/events.schema.json; no free text or location.

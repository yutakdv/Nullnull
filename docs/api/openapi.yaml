          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationHistoryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /optimizations/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Optimizations]
      operationId: getOptimization
      summary: Get optimization state and immutable proposals
      description: |
        Return server-computed revertAvailability when supported. Preview expiry prevents a
        new APPLY/KEEP, but must not turn an already APPLIED or REVERTED run into PREVIEW_EXPIRED.
        Existing run metadata and decisions remain readable under the owner retention policy;
        do not extend or duplicate proposal/snapshot retention for this projection. An APPLIED
        run remains APPLIED when its revert window expires. Revert still revalidates state
        atomically; a preceding AVAILABLE read is not an authorization to skip those checks.
      x-error-codes:
        asynchronous: [TRIP_CHANGED, DATA_CHANGED, LOCK_CONFLICT, ROUTE_UNAVAILABLE, NO_IMPROVEMENT]
        "410": [PREVIEW_EXPIRED]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Run state and immutable proposals when ready
          headers:
            Retry-After:
              description: Present for QUEUED/RUNNING responses
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationRun"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Undecided preview expired; does not apply to an already recorded decision
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /optimizations/{runId}/decisions:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Optimizations]
      operationId: decideOptimization
      summary: Apply or keep an optimization proposal
      description: |
        Exactly one initial APPLY or KEEP decision is allowed per run. APPLY revalidates the
        frozen trip revision, all constraints, snapshot fingerprint, and preview expiry in one
        transaction. KEEP records intent but does not increment trip version. A failed APPLY
        records no decision and changes no trip row, so the same idempotency key can replay it.
        APPLY always returns non-null beforeRevisionId, afterRevisionId, resultingTripVersion,
        and revertUntil; revertUntil is exactly 24 hours after the server's decidedAt.
      x-error-codes:
        "409": [TRIP_CHANGED, DATA_CHANGED]
        "422": [LOCK_CONFLICT, NO_IMPROVEMENT]
        "503": [ROUTE_UNAVAILABLE, APPLY_FAILED]
        "429": [RATE_LIMITED]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizationDecisionRequest"
      responses:
        "200":
          description: Decision recorded; APPLY includes the new trip version
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialOptimizationDecision"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Problem"
  /optimization-decisions/{decisionId}/revert:
    parameters:
      - $ref: "#/components/parameters/DecisionId"
    post:
      tags: [Optimizations]
      operationId: revertOptimizationDecision
      summary: Restore the state before an applied proposal
      description: |
        Allowed once, only for an APPLY decision, for 24 hours after decidedAt. The immutable
        before revision is restored as a new revision; history is never overwritten. Revert is
        rejected if the current trip version differs from the applied revision.
      x-error-codes:
        "409": [TRIP_CHANGED]
        "410": [REVERT_WINDOW_EXPIRED]
        "503": [APPLY_FAILED]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: A new trip revision restores the pre-apply state
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevertOptimizationDecision"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: The applied decision's 24-hour revert window expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /live/areas:
    post:
      tags: [Live]
      operationId: queryLiveAreas
      summary: Query live or replay crowd areas
      description: |
        Read-only POST keeps an optional coarse viewport out of access URLs. Coordinates must
        be rounded to at most three decimals and cover at least 0.01 degrees on each axis;
        exact device coordinates are forbidden and the body is not logged or persisted.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveAreaQuery"
      responses:
        "200":
          description: Live area map/list payload
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveAreaResult"
        default:
          $ref: "#/components/responses/Problem"
  /live/areas/{areaId}/places:
    parameters:
      - $ref: "#/components/parameters/AreaId"
    get:
      tags: [Live]
      operationId: listLiveAreaPlaces
      summary: List places mapped to a live area
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Places mapped to the selected live area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LivePlace"
        default:
          $ref: "#/components/responses/Problem"
  /live/places/{placeId}:
    parameters:
      - $ref: "#/components/parameters/PlaceId"
    get:
      tags: [Live]
      operationId: getLivePlace
      summary: Get a live place and related alternatives
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Place details with current, forecast, replay, or unavailable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePlaceDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Problem"

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List notifications for the current owner
      x-release: P1
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Notification page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        default:
          $ref: "#/components/responses/Problem"
  /notifications/read-all:
    put:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all notifications visible at request time as read
      description: Newer notifications committed after the request cutoff remain unread.
      x-release: P1
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Count and server cutoff applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllNotificationsReadResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    put:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read
      x-release: P1
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Notification marked read
        default:
          $ref: "#/components/responses/Problem"

  /events/batch:
    post:
      tags: [Analytics]
      operationId: ingestEventBatch
      summary: Ingest a privacy-minimized analytics event batch
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventBatch"
      responses:
        "202":
          description: Valid events accepted; duplicate eventIds ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBatchReceipt"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nullnull_session
      description: Opaque, Secure, HttpOnly session cookie.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token issued by session bootstrap and held in memory only.
    deletionStatusToken:
      type: apiKey
      in: header
      name: X-Deletion-Status-Token
      description: One-purpose deletion receipt token; store in memory only and never log it.

  headers:
    RequestId:
      description: Correlation identifier safe to show in support UI.
      schema:
        type: string
        maxLength: 100
    ETag:
      description: Quoted trip version, for example `"7"`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID recommended. Reuse only for an exact retry of the same request.
      schema:
        type: string
        minLength: 16
        maxLength: 100
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest mutable trip or import-draft representation.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    Cursor:
      name: cursor
      in: query
      description: Signed opaque cursor bound to owner, endpoint, filter hash, sort, and schema version; expires after 15 minutes.
      schema:
        type: string
        minLength: 20
        maxLength: 500
        pattern: '^[A-Za-z0-9_-]+$'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaceId:
      name: placeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DecisionId:
      name: decisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AreaId:
      name: areaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeletionRequestId:
      name: deletionRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConstraintType:
      name: constraintType
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConstraintType"

  responses:
    Problem:
      description: Error response
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: Malformed input
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Session is absent, expired, or revoked
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource is absent or not owned by this session
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            notFound:
              summary: NOT_FOUND is the only code this status carries
              description: |
                Absent and not-yours are one answer on purpose: telling them apart would let a caller
                probe which identifiers exist. Branch on `code`, not on the wording of `detail`.
              value:
                type: "/problems/not-found"
                title: "Not found"
                status: 404
                code: "NOT_FOUND"
                detail: "The requested resource does not exist."
                instance: "/api/v1/trips/018f3f8e-9b67-7a21-8d31-31d315b93911"
                requestId: "01J8Z9K2Q4R6T8V0X2Z4B6D8F0"
                retryable: false
    Conflict:
      description: Version, idempotency, or current-state conflict
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: Syntactically valid request violates a domain constraint
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: |
        Request body media type is not the one the operation declares. The merge-patch operations
        accept application/merge-patch+json only, because absent-means-keep and null-means-clear are
        semantics of that media type rather than of the schema.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A required capability is temporarily unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Owner, IP, or provider-safe rate limit exceeded
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          description: Whole seconds until the client may retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, time]
      properties:
        status:
          type: string
          const: UP
        time:
          type: string
          format: date-time
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [READY, DEGRADED, NOT_READY]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityStatus"
    CapabilityStatus:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [READY, DEGRADED, UNAVAILABLE]
        checkedAt:
          type: string
          format: date-time
        detail:
          type: [string, "null"]
    CreateDemoSessionRequest:
      type: object
      additionalProperties: false
      properties:
        locale:
          type: string
          default: ko-KR
        timezone:
          type: string
          default: Asia/Seoul
    SessionBootstrap:
      type: object
      additionalProperties: false
      required: [owner, csrfToken, expiresAt]
      properties:
        owner:
          $ref: "#/components/schemas/OwnerProfile"
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
        expiresAt:
          description: Expiry of the returned CSRF token; session idle and absolute TTL are server-enforced independently.
          type: string
          format: date-time
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required: [csrfToken, expiresAt]
      properties:
        csrfToken:
          type: string
          minLength: 32
          maxLength: 512
        expiresAt:
          description: Expiry of the returned CSRF token; session idle and absolute TTL are server-enforced independently.
          type: string
          format: date-time
    OwnerProfile:
      type: object
      additionalProperties: false
      required: [id, kind, locale, timezone, onboardingCompleted]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [ANONYMOUS, ACCOUNT]
        locale:
          type: string
          minLength: 2
          maxLength: 35
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        onboardingCompleted:
          type: boolean
        activeTripId:
          type: [string, "null"]
          format: uuid
    UpdatePreferencesRequest:
      type: object
      additionalProperties: false
      properties:
        locale:
          type: string
          minLength: 2
          maxLength: 35
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        onboardingCompleted:
          type: boolean
        activeTripId:
          type: [string, "null"]
          format: uuid
      minProperties: 1
    DeletionReceipt:
      type: object
      additionalProperties: false
      required: [requestId, status, statusToken, statusTokenExpiresAt, requestedAt, statusUrl]
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          const: ACCEPTED
        statusToken:
          type: string
          minLength: 32
          maxLength: 512
          description: One-purpose bearer token; FE keeps it in memory only.
        statusTokenExpiresAt:
          type: string
          format: date-time
        requestedAt:
          type: string
          format: date-time
        statusUrl:
          type: string
          format: uri-reference
          description: |
            Absolute API path of the status resource, including the `/api/v1` server base - unlike
            `runLink`, which is a client router path and carries no base. A client using the generated
            client should call getDeletionRequest with `requestId` rather than reusing this string,
            because that client already applies the base and would double it. Treat this as
            informational, or as the target for a raw request that applies no base of its own.
          example: "/api/v1/deletion-requests/018f4d00-1111-7222-8333-444455556666"
    DeletionRequestStatus:
      type: object
      additionalProperties: false
      required: [requestId, status, requestedAt, updatedAt]
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACCEPTED, RUNNING, COMPLETED, PARTIAL_FAILED, FAILED]
          description: |
            COMPLETED and FAILED are the states a client may stop polling on. PARTIAL_FAILED is NOT
            one of them: it means an attempt failed while the server still has attempts left, so the
            server retries on its own and the status changes again without any client action. ACCEPTED
            and RUNNING are in progress. Do not derive terminality from `completedAt` — it is set when
            an erasure completes and is not cleared if a later attempt starts.
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        retryable:
          type: boolean
          default: false
          description: |
            True exactly while `status` is PARTIAL_FAILED, meaning the server has attempts left and
            will make them. It describes the server's own retrying, not a prompt for the client to
            resubmit the deletion: the request is already accepted and resubmitting is never required.
        failureCode:
          type: [string, "null"]
          maxLength: 100
    DemoReadiness:
      type: object
      additionalProperties: false
      required: [overall, capabilities, checkedAt]
      properties:
        overall:
          type: string
          enum: [READY, DEGRADED, NOT_READY]
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityStatus"
        checkedAt:
          type: string
          format: date-time

    CursorPage:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
    FeedPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedCard"
        page:
          $ref: "#/components/schemas/CursorPage"
    FeedCard:
      type: object
      additionalProperties: false
      required: [post, primaryPlace, savedPost, candidateState]
      properties:
        post:
          $ref: "#/components/schemas/PostSummary"
        primaryPlace:
          $ref: "#/components/schemas/PlaceSummary"
        crowd:
          oneOf:
            - $ref: "#/components/schemas/CrowdMetric"
            - type: "null"
        savedPost:
          type: boolean
        candidateState:
          type: string
          enum: [NOT_SAVED, SAVED_TO_SELECTED_TRIP, SCHEDULED_IN_SELECTED_TRIP, NO_TRIP_SELECTED]
    PostSummary:
      type: object
      additionalProperties: false
      required: [id, title, coverUrl, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        excerpt:
          type: [string, "null"]
        coverUrl:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
    PostDetail:
      type: object
      additionalProperties: false
      required: [id, title, coverUrl, publishedAt, body, places, saved]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        excerpt:
          type: [string, "null"]
          maxLength: 500
        coverUrl:
          type: string
          format: uri
        coverAsset:
          oneOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        publishedAt:
          type: string
          format: date-time
        body:
          type: string
          maxLength: 20000
        places:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/PlaceSummary"
        saved:
          type: boolean
    SavedPostState:
      type: object
      additionalProperties: false
      required: [postId, saved, duplicate, savedAt]
      properties:
        postId:
          type: string
          format: uuid
        saved:
          type: boolean
        duplicate:
          type: boolean
        savedAt:
          type: string
          format: date-time
    FeedFeedbackRequest:
      type: object
      additionalProperties: false
      required: [postId, action, occurredAt]
      properties:
        postId:
          type: string
          format: uuid
        action:
          type: string
          enum: [IMPRESSION, OPEN, HIDE, LIKE, DISLIKE]
        occurredAt:
          type: string
          format: date-time

    SourceAttribution:
      type: object
      additionalProperties: false
      description: |
        Where this place record came from and the credit text approved for it. The server projects
        the reviewed source registry revision that the place was collected under, so the client never
        decides which provider to credit and never hardcodes a provider name.
      required: [source, sourceDisplayName, sourceRegistryVersion, attribution, officialUrl, licenseUrl, license]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 64
          description: Source registry code, e.g. the KTO tourism service. Machine identifier, not display copy.
        sourceDisplayName:
          type: string
          minLength: 1
          maxLength: 200
        sourceRegistryVersion:
          type: integer
          minimum: 1
          description: The reviewed revision in force when this place was collected.
        attribution:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            The approved credit text to display verbatim, e.g. the public-data source line. Display
            this string as given; do not compose, translate or abbreviate it, and never merge two
            providers into one credit.
        officialUrl:
          type: [string, "null"]
          format: uri
        licenseUrl:
          type: [string, "null"]
          format: uri
        license:
          type: [string, "null"]
          maxLength: 200

    PlaceSummary:
      type: object
      additionalProperties: false
      # categoryName, regionName and sourceAttribution are always sent by the server. They stay out of
      # `required` while the shape is a proposal, so adopting them is a choice rather than a forced
      # edit to every existing consumer and test double. They move into `required` once the frontend
      # has approved and adopted them (#34).
      required: [id, name, categoryCode, regionCode]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryCode:
          type: string
          description: |
            Opaque provider-derived classification code for filtering and sorting. It is not display
            copy: render `categoryName` instead, and render nothing when that is null.
        regionCode:
          type: string
          description: |
            Opaque provider-derived region code for filtering and sorting. It is not display copy:
            render `regionName` instead, and render nothing when that is null.
        categoryName:
          type: [string, "null"]
          maxLength: 200
          description: |
            Server-localized display name for `categoryCode`, or null when no reviewed mapping exists
            for that code yet. Null means "do not show a category", never "unknown category".
        regionName:
          type: [string, "null"]
          maxLength: 200
          description: Server-localized display name for `regionCode`, or null when no reviewed mapping exists.
        sourceAttribution:
          oneOf:
            - $ref: "#/components/schemas/SourceAttribution"
            - type: "null"
          description: Null only for records with no external source, such as a user-created place.
        thumbnailUrl:
          type: [string, "null"]
          format: uri
        address:
          type: [string, "null"]
    PlaceDetail:
      type: object
      additionalProperties: false
      required: [id, name, categoryCode, regionCode, description, location, externalRefs]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryCode:
          type: string
          minLength: 1
          maxLength: 100
          description: Opaque provider-derived code. Render `categoryName`, not this value.
        regionCode:
          type: string
          minLength: 1
          maxLength: 100
          description: Opaque provider-derived code. Render `regionName`, not this value.
        categoryName:
          type: [string, "null"]
          maxLength: 200
        regionName:
          type: [string, "null"]
          maxLength: 200
        sourceAttribution:
          oneOf:
            - $ref: "#/components/schemas/SourceAttribution"
            - type: "null"
        thumbnailUrl:
          type: [string, "null"]
          format: uri
        thumbnailAsset:
          oneOf:
            - $ref: "#/components/schemas/MediaAsset"
            - type: "null"
        address:
          type: [string, "null"]
          maxLength: 500
        description:
          type: [string, "null"]
          maxLength: 10000
        location:
          $ref: "#/components/schemas/GeoPoint"
        externalRefs:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExternalReference"
    GeoPoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ExternalReference:
      type: object
      additionalProperties: false
      required: [source, externalId, verifiedAt]
      properties:
        source:
          type: string
        externalId:
          type: string
        verifiedAt:
          type: string
          format: date-time
    MediaAsset:
      type: object
      additionalProperties: false
      required: [id, url, mediaType, license, attributionRequired, redistributionAllowed]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        mediaType:
          type: string

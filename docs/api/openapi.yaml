        alt:
          type: [string, "null"]
          maxLength: 500
        license:
          $ref: "#/components/schemas/AssetLicense"
        attributionRequired:
          type: boolean
        attributionText:
          type: [string, "null"]
          maxLength: 500
        redistributionAllowed:
          type: boolean
        expiresAt:
          type: [string, "null"]
          format: date-time
    AssetLicense:
      type: object
      additionalProperties: false
      required: [source, name, reviewedAt]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: [string, "null"]
          format: uri
        reviewedAt:
          type: string
          format: date-time
    PlaceSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 100
        locale:
          type: string
          minLength: 2
          maxLength: 35
          default: ko-KR
        regionCode:
          type: [string, "null"]
          maxLength: 100
        cursor:
          type: [string, "null"]
          maxLength: 500
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    PlaceSearchPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaceSummary"
        page:
          $ref: "#/components/schemas/CursorPage"

    SourceState:
      type: string
      enum: [LIVE, FORECAST, REPLAY, QUALITATIVE, STALE, UNAVAILABLE]
    Freshness:
      type: string
      enum: [FRESH, AGING, STALE, UNKNOWN]
    DataProvenance:
      type: object
      additionalProperties: false
      required:
        - source
        - sourceDisplayName
        - sourceRegistryVersion
        - sourceState
        - observedAt
        - targetAt
        - freshness
        - fetchedAt
        - staleAt
        - confidence
        - license
        - attribution
        - metricDefinition
        - normalizationVersion
        - qualityFlags
        - forecastIssueId
        - comparisonAxis
        - comparisonEligible
        - comparisonReasonCode
        - comparisonGroupId
        - collectorRunId
        - snapshotSetId
        - observedAtSkewSeconds
        - scope
        - scopeLabel
        - mappingType
        - fallbackUsed
        - provenanceId
      properties:
        source:
          type: string
        sourceDisplayName:
          type: string
        sourceRegistryVersion:
          type: integer
          minimum: 1
        sourceState:
          $ref: "#/components/schemas/SourceState"
        observedAt:
          type: [string, "null"]
          format: date-time
        targetAt:
          type: [string, "null"]
          format: date-time
        fetchedAt:
          type: string
          format: date-time
        staleAt:
          type: [string, "null"]
          format: date-time
        freshness:
          $ref: "#/components/schemas/Freshness"
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        license:
          type: [string, "null"]
        attribution:
          type: [string, "null"]
        metricDefinition:
          type: [string, "null"]
        normalizationVersion:
          type: string
        qualityFlags:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - PROVIDER_INCIDENT
              - SCHEMA_DRIFT
              - MAPPING_UNCERTAIN
              - OBSERVED_AT_SKEW
              - PARTIAL_PAYLOAD
        forecastIssueId:
          type: [string, "null"]
        comparisonAxis:
          type: [string, "null"]
          enum: [TEMPORAL, SPATIAL, null]
        comparisonEligible:
          type: boolean
        comparisonReasonCode:
          type: [string, "null"]
        comparisonGroupId:
          type: [string, "null"]
        collectorRunId:
          type: [string, "null"]
          format: uuid
        snapshotSetId:
          type: [string, "null"]
          format: uuid
        observedAtSkewSeconds:
          type: [integer, "null"]
          minimum: 0
        scope:
          type: [string, "null"]
        scopeLabel:
          type: [string, "null"]
        mappingType:
          type: [string, "null"]
        fallbackUsed:
          type: boolean
          default: false
        provenanceId:
          type: [string, "null"]
          format: uuid
          description: Stable normalized snapshot identifier; null only for UNAVAILABLE.
    CrowdMetric:
      type: object
      additionalProperties: false
      required: [state, label, provenance]
      properties:
        state:
          $ref: "#/components/schemas/SourceState"
        value:
          type: [number, "null"]
        unit:
          type: [string, "null"]
        ordinalLevel:
          type: [string, "null"]
        label:
          type: string
        provenance:
          $ref: "#/components/schemas/DataProvenance"
    CrowdSeries:
      type: object
      additionalProperties: false
      required: [placeId, state, points]
      properties:
        placeId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/SourceState"
        points:
          type: array
          items:
            $ref: "#/components/schemas/CrowdMetric"
        unavailableReason:
          type: [string, "null"]
    RelationState:
      type: string
      enum: [EXACT, SIMILAR, NONE, CHECKING, UNKNOWN]
    RelatedPlaceResult:
      type: object
      additionalProperties: false
      required: [sourcePlaceId, state, items]
      properties:
        sourcePlaceId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/RelationState"
        reason:
          type: [string, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/RelatedPlace"
    RelatedPlace:
      type: object
      additionalProperties: false
      required: [place, relation, relationReason, provenance]
      properties:
        place:
          $ref: "#/components/schemas/PlaceSummary"
        relation:
          type: string
          enum: [EXACT, SIMILAR]
        relationReason:
          type: string
        crowd:
          oneOf:
            - $ref: "#/components/schemas/CrowdMetric"
            - type: "null"
        provenance:
          $ref: "#/components/schemas/DataProvenance"

    TripStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    PlanningLevel:
      type: string
      enum: [NOTHING, MUST_VISIT_ONLY, MOSTLY_PLANNED]
    TripSummary:
      type: object
      additionalProperties: false
      required: [id, title, startDate, endDate, timezone, status, version, candidateCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        timezone:
          type: string
        status:
          $ref: "#/components/schemas/TripStatus"
        version:
          type: integer
          format: int64
          minimum: 1
        candidateCount:
          type: integer
          minimum: 0
    TripPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TripSummary"
        page:
          $ref: "#/components/schemas/CursorPage"
    TripDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - startDate
        - endDate
        - timezone
        - status
        - version
        - candidateCount
        - planningLevel
        - interests
        - days
        - candidates
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: "#/components/schemas/TripStatus"
        version:
          type: integer
          format: int64
          minimum: 1
        candidateCount:
          type: integer
          minimum: 0
          maximum: 500
        planningLevel:
          $ref: "#/components/schemas/PlanningLevel"
        interests:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TripInterest"
        days:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/TripDay"
        candidates:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/TripCandidate"
    TripInterest:
      type: object
      additionalProperties: false
      required: [code, weight]
      properties:
        code:
          type: string
        weight:
          type: integer
          minimum: 1
          maximum: 5
    TripDay:
      type: object
      additionalProperties: false
      required: [date, items]
      properties:
        date:
          type: string
          format: date
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/TripItem"
    TripItem:
      type: object
      additionalProperties: false
      required: [id, place, date, position, constraints]
      properties:
        id:
          type: string
          format: uuid
        place:
          $ref: "#/components/schemas/PlaceSummary"
        date:
          type: string
          format: date
        position:
          type: integer
          minimum: 0
        startTime:
          type: [string, "null"]
          format: time
        durationMinutes:
          type: [integer, "null"]
          minimum: 1
        note:
          type: [string, "null"]
          maxLength: 500
        constraints:
          type: array
          items:
            $ref: "#/components/schemas/TripConstraint"
        crowd:
          oneOf:
            - $ref: "#/components/schemas/CrowdMetric"
            - type: "null"
    ConstraintType:
      type: string
      enum: [MUST_VISIT, DATE, TIME, RESERVATION]
    TripConstraint:
      oneOf:
        - $ref: "#/components/schemas/MustVisitConstraint"
        - $ref: "#/components/schemas/DateConstraint"
        - $ref: "#/components/schemas/TimeConstraint"
        - $ref: "#/components/schemas/ReservationConstraint"
      discriminator:
        propertyName: type
        mapping:
          MUST_VISIT: "#/components/schemas/MustVisitConstraint"
          DATE: "#/components/schemas/DateConstraint"
          TIME: "#/components/schemas/TimeConstraint"
          RESERVATION: "#/components/schemas/ReservationConstraint"
    MustVisitConstraint:
      type: object
      additionalProperties: false
      required: [type, locked, source]
      properties:
        type:
          type: string
          const: MUST_VISIT
        locked:
          type: boolean
          const: true
        source:
          type: string
          enum: [USER, IMPORT]
    DateConstraint:
      type: object
      additionalProperties: false
      required: [type, locked, source, date]
      properties:
        type:
          type: string
          const: DATE
        locked:
          type: boolean
          const: true
        source:
          type: string
          enum: [USER, IMPORT]
        date:
          type: string
          format: date
    TimeConstraint:
      type: object
      additionalProperties: false
      required: [type, locked, source, startTime, toleranceMinutes]
      properties:
        type:
          type: string
          const: TIME
        locked:
          type: boolean
          const: true
        source:
          type: string
          enum: [USER, IMPORT]
        startTime:
          type: string
          format: time
        toleranceMinutes:
          type: integer
          minimum: 0
          maximum: 180
    ReservationConstraint:
      type: object
      additionalProperties: false
      required: [type, locked, source, date, startTime]
      properties:
        type:
          type: string
          const: RESERVATION
        locked:
          type: boolean
          const: true
        source:
          type: string
          enum: [USER, IMPORT]
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: [string, "null"]
          format: time
    CreateTripRequest:
      type: object
      additionalProperties: false
      required: [startDate, endDate, timezone, planningLevel, interests]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional user title. When omitted, the server creates a deterministic locale-aware default (새 여행/New trip); it never asks an LLM to invent one.
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Inclusive; server rejects ranges longer than 30 calendar days.
        timezone:
          type: string
          default: Asia/Seoul
        planningLevel:
          $ref: "#/components/schemas/PlanningLevel"
        interests:
          type: array
          minItems: 0
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TripInterest"
        seedItems:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SeedTripItem"
    SeedTripItem:
      type: object
      additionalProperties: false
      required: [placeId, date, position]
      properties:
        placeId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        position:
          type: integer
          minimum: 0
        startTime:
          type: [string, "null"]
          format: time
        constraints:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SetConstraintInput"
    UpdateTripRequest:
      type: object
      additionalProperties: false
      description: Date-range shrink is rejected with VALIDATION_FAILED while any item or DATE/RESERVATION lock lies outside the new range.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          description: IANA timezone. Existing local dates and wall-clock times are preserved; the server revalidates derived instants and rejects conflicts instead of silently moving items.
        planningLevel:
          $ref: "#/components/schemas/PlanningLevel"
        status:
          $ref: "#/components/schemas/TripStatus"
      minProperties: 1
    ReplaceInterestsRequest:
      type: object
      additionalProperties: false
      required: [interests]
      properties:
        interests:
          type: array
          minItems: 0
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TripInterest"

    ParseImportRequest:
      type: object
      additionalProperties: false
      required: [rawText, locale, timezone]
      properties:
        rawText:
          type: string
          minLength: 1
          maxLength: 20000
          description: Ephemeral input; never persisted, logged, or echoed.
        locale:
          type: string
          default: ko-KR
        timezone:
          type: string
          default: Asia/Seoul
    ImportDraft:
      type: object
      additionalProperties: false
      required: [id, version, status, title, dates, items, unresolved, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum: [NEEDS_REVIEW, READY, CONFIRMED, EXPIRED]
        title:
          type: [string, "null"]
        dates:
          $ref: "#/components/schemas/DateRange"
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ImportDraftItem"
        unresolved:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/UnresolvedImportToken"
        expiresAt:
          type: string
          format: date-time
    DateRange:
      type: object
      additionalProperties: false
      properties:
        startDate:
          type: [string, "null"]
          format: date
        endDate:
          type: [string, "null"]
          format: date
    ImportDraftItem:
      type: object
      additionalProperties: false
      required: [clientKey, date, position, confidence]
      properties:
        clientKey:
          type: string
        place:
          oneOf:
            - $ref: "#/components/schemas/PlaceSummary"
            - type: "null"
        originalLabel:
          type: string
          description: Short parsed token only, not the surrounding raw itinerary.
        date:
          type: [string, "null"]
          format: date
        startTime:
          type: [string, "null"]
          format: time
        position:
          type: integer
          minimum: 0
        confidence:
          type: number
          minimum: 0
          maximum: 1
        constraints:
          type: array
          maxItems: 4
          uniqueItems: true
          description: Independently parsed locks; source becomes IMPORT on confirmation.
          items:
            $ref: "#/components/schemas/SetConstraintInput"
    UnresolvedImportToken:
      type: object
      additionalProperties: false
      required: [clientKey, kind, label, suggestions]
      properties:
        clientKey:
          type: string
        kind:
          type: string
          enum: [PLACE, DATE, TIME]
        label:
          type: string
        suggestions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PlaceSummary"
    RemapImportRequest:
      type: object
      additionalProperties: false
      required: [updates]
      properties:
        updates:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [clientKey]
            properties:
              clientKey:
                type: string
              placeId:
                type: [string, "null"]
                format: uuid
              date:
                type: [string, "null"]
                format: date
              startTime:
                type: [string, "null"]
                format: time
              position:
                type: [integer, "null"]
                minimum: 0
              constraints:
                type: [array, "null"]
                maxItems: 4
                items:
                  $ref: "#/components/schemas/SetConstraintInput"
    ConfirmImportRequest:
      type: object
      additionalProperties: false
      required: [title, planningLevel, interests]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        planningLevel:
          $ref: "#/components/schemas/PlanningLevel"
        interests:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TripInterest"

    CandidateStatus:
      type: string
      enum: [ACTIVE, SCHEDULED, DISMISSED]
    TripCandidate:
      type: object
      additionalProperties: false
      required: [id, tripId, place, status, sources, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        place:
          $ref: "#/components/schemas/PlaceSummary"
        status:
          $ref: "#/components/schemas/CandidateStatus"
        scheduledTripItemId:
          type: [string, "null"]
          format: uuid
        note:
          type: [string, "null"]
          maxLength: 500
        sources:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/CandidateSource"
        createdAt:
          type: string
          format: date-time
    CandidateSource:
      type: object
      additionalProperties: false
      required: [type, createdAt]
      properties:
        type:
          type: string
          enum: [POST, SEARCH, LIVE, IMPORT]
        postId:
          type: [string, "null"]
          format: uuid
        createdAt:
          type: string
          format: date-time
    AddCandidateRequest:
      type: object
      additionalProperties: false
      required: [placeId, source]
      properties:
        placeId:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/AddCandidateSource"
        note:
          type: [string, "null"]
          maxLength: 500
    AddCandidateSource:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [POST, SEARCH, LIVE, IMPORT]
        postId:
          type: [string, "null"]
          format: uuid
    CandidateSaveResult:
      type: object
      additionalProperties: false
      required: [candidate, duplicate, tripScheduleChanged]
      properties:
        candidate:
          $ref: "#/components/schemas/TripCandidate"
        duplicate:
          type: boolean
        tripScheduleChanged:
          type: boolean
          const: false
    CandidatePage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TripCandidate"
        page:
          $ref: "#/components/schemas/CursorPage"
    CandidateMatchResult:
      type: object
      additionalProperties: false
      required: [candidateId, state, slots]
      properties:
        candidateId:
          type: string
          format: uuid
        state:
          type: string
          enum: [EXACT, SIMILAR, NONE, CHECKING, UNKNOWN]
        slots:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, eligible]
            properties:
              date:
                type: string
                format: date
              suggestedTime:
                type: [string, "null"]
                format: time
              eligible:
                type: boolean
              reasonCode:
                type: [string, "null"]

    AddTripItemRequest:
      type: object
      additionalProperties: false
      required: [placeId, date, position]
      properties:
        placeId:
          type: string
          format: uuid
        candidateId:
          type: [string, "null"]
          format: uuid
        date:
          type: string
          format: date
        position:
          type: integer
          minimum: 0
        startTime:
          type: [string, "null"]
          format: time
        durationMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 1440
        note:
          type: [string, "null"]
          maxLength: 500
        constraints:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SetConstraintInput"
    UpdateTripItemRequest:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        position:
          type: integer
          minimum: 0
        startTime:
          type: [string, "null"]
          format: time
        durationMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 1440
        note:
          type: [string, "null"]
          maxLength: 500
      minProperties: 1
    ReorderTripItemsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [itemId, date, position]
            properties:
              itemId:
                type: string
                format: uuid
              date:
                type: string
                format: date
              position:
                type: integer
                minimum: 0
    ReplaceTripItemRequest:
      type: object
      additionalProperties: false
      required: [replacementPlaceId]
      properties:
        replacementPlaceId:
          type: string
          format: uuid
        relationId:
          type: [string, "null"]
          format: uuid
        preserveDateTime:
          type: boolean
          default: true
    SetConstraintInput:
      oneOf:
        - $ref: "#/components/schemas/SetMustVisitConstraintInput"
        - $ref: "#/components/schemas/SetDateConstraintInput"
        - $ref: "#/components/schemas/SetTimeConstraintInput"
        - $ref: "#/components/schemas/SetReservationConstraintInput"
      discriminator:
        propertyName: type
    SetMustVisitConstraintInput:
      type: object
      additionalProperties: false
      required: [type, locked]
      properties:
        type:
          type: string
          const: MUST_VISIT
        locked:
          type: boolean
          const: true
    SetDateConstraintInput:
      type: object
      additionalProperties: false
      required: [type, locked, date]
      properties:
        type:
          type: string
          const: DATE
        locked:
          type: boolean
          const: true
        date:
          type: string
          format: date
    SetTimeConstraintInput:
      type: object
      additionalProperties: false
      required: [type, locked, startTime, toleranceMinutes]
      properties:
        type:
          type: string
          const: TIME
        locked:
          type: boolean
          const: true
        startTime:
          type: string
          format: time
        toleranceMinutes:
          type: integer
          minimum: 0
          maximum: 180
    SetReservationConstraintInput:
      type: object
      additionalProperties: false
      required: [type, locked, date, startTime]
      properties:
        type:
          type: string
          const: RESERVATION
        locked:
          type: boolean
          const: true
        date:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: [string, "null"]
          format: time
    SetConstraintRequest:
      $ref: "#/components/schemas/SetConstraintInput"
    TripMutationResult:
      type: object
      additionalProperties: false
      required: [trip, changedItemIds]
      properties:
        trip:
          $ref: "#/components/schemas/TripDetail"
        changedItemIds:
          type: array
          items:
            type: string
            format: uuid

    OptimizationScope:
      type: string
      enum: [ITEM, DAY, TRIP]
    OptimizationStatus:
      type: string
      enum: [QUEUED, RUNNING, READY, APPLIED, KEPT, REVERTED, FAILED, EXPIRED]
    CreateOptimizationRequest:
      type: object
      additionalProperties: false
      required: [scope, inputTripVersion, includeCandidates]
      properties:
        scope:
          $ref: "#/components/schemas/OptimizationScope"
        inputTripVersion:
          type: integer
          format: int64
          minimum: 1
        targetItemId:
          type: [string, "null"]
          format: uuid
        targetDate:
          type: [string, "null"]
          format: date
        includeCandidates:
          type: boolean
          default: false
        objective:
          type: string
          enum: [REDUCE_CROWD]
          default: REDUCE_CROWD
    OptimizationRun:
      type: object
      additionalProperties: false
      required:
        - id
        - tripId
        - scope
        - status
        - inputTripVersion
        - includeCandidates
        - queuedAt
        - proposals
        - snapshotSetIds
        - decisions
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        scope:
          $ref: "#/components/schemas/OptimizationScope"
        status:
          $ref: "#/components/schemas/OptimizationStatus"
        inputTripVersion:
          type: integer
          format: int64
        inputRevisionId:
          type: [string, "null"]
          format: uuid
        includeCandidates:
          type: boolean
        dataFingerprint:
          type: [string, "null"]
        algorithmVersion:
          type: [string, "null"]
        queuedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        proposals:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/OptimizationProposal"
        snapshotSetIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        decisions:
          type: array
          maxItems: 2
          description: Empty, one initial APPLY/KEEP, then optional one REVERT of APPLY.
          items:
            $ref: "#/components/schemas/OptimizationDecision"
        failure:
          oneOf:
            - $ref: "#/components/schemas/OptimizationFailure"
            - type: "null"
    OptimizationProposal:
      type: object
      additionalProperties: false
      required:
        - id
        - rank
        - summary
        - changes
        - metrics
        - validation
        - dataProvenance
      properties:
        id:
          type: string
          format: uuid
        rank:
          type: integer
          minimum: 1
        summary:
          type: string
          minLength: 1
          maxLength: 500
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/OptimizationChange"
        metrics:
          $ref: "#/components/schemas/OptimizationMetrics"
        validation:
          $ref: "#/components/schemas/ValidationSummary"
        dataProvenance:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DataProvenance"
    OptimizationChange:
      oneOf:
        - $ref: "#/components/schemas/OptimizationExistingItemChange"
        - $ref: "#/components/schemas/OptimizationAddChange"
        - $ref: "#/components/schemas/OptimizationRemoveChange"
      discriminator:
        propertyName: operation
    OptimizationExistingItemChange:
      type: object
      additionalProperties: false
      required: [operation, itemId, before, after]
      properties:
        operation:
          type: string
          enum: [MOVE, REORDER, REPLACE]
        itemId:
          type: string
          format: uuid
        before:
          $ref: "#/components/schemas/TripItemState"
        after:
          $ref: "#/components/schemas/TripItemState"
    OptimizationAddChange:
      type: object
      additionalProperties: false
      required: [operation, itemId, before, after]
      properties:
        operation:
          type: string
          const: ADD
        itemId:
          type: string
          format: uuid
          description: Stable prospective item ID reserved by the preview.
        before:
          type: "null"
        after:
          $ref: "#/components/schemas/TripItemState"
    OptimizationRemoveChange:
      type: object
      additionalProperties: false
      required: [operation, itemId, before, after]
      properties:
        operation:
          type: string
          const: REMOVE
        itemId:
          type: string
          format: uuid
        before:
          $ref: "#/components/schemas/TripItemState"
        after:
          type: "null"
    TripItemState:
      type: object
      additionalProperties: false
      required: [placeId, date, position]
      properties:
        placeId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        position:
          type: integer
        startTime:
          type: [string, "null"]
          format: time
        crowd:
          oneOf:
            - $ref: "#/components/schemas/CrowdMetric"
            - type: "null"
    OptimizationMetrics:
      type: object
      additionalProperties: false
      required: [comparisonEligible, crowdComparison]
      properties:
        comparisonEligible:
          type: boolean
        comparisonReasonCode:
          type: [string, "null"]
        crowdBefore:
          type: [number, "null"]
        crowdAfter:
          type: [number, "null"]
        crowdDelta:
          type: [number, "null"]
        travelMinutesDelta:
          type: [integer, "null"]
        crowdComparison:
          oneOf:
            - $ref: "#/components/schemas/CrowdComparison"
            - type: "null"
    CrowdComparison:
      type: object
      additionalProperties: false
      required:
        - comparisonId
        - axis
        - eligible
        - reasonCode
        - beforeSnapshotId
        - afterSnapshotId
        - beforeValue
        - afterValue
        - delta
      properties:
        comparisonId:
          type: string
          format: uuid
        axis:
          type: string
          enum: [TEMPORAL, SPATIAL]
        eligible:
          type: boolean
        reasonCode:
          type: string
          maxLength: 100
        beforeSnapshotId:
          type: [string, "null"]
          format: uuid
        afterSnapshotId:
          type: [string, "null"]
          format: uuid
        beforeValue:
          type: [number, "null"]
        afterValue:
          type: [number, "null"]
        delta:
          type: [number, "null"]
          description: Must be null whenever eligible is false.
    ValidationSummary:
      type: object
      additionalProperties: false
      required: [allConstraintsPreserved, checks]
      properties:
        allConstraintsPreserved:
          type: boolean
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [constraintType, passed]
            properties:
              constraintType:
                $ref: "#/components/schemas/ConstraintType"
              itemId:
                type: [string, "null"]
                format: uuid
              passed:
                type: boolean
              detail:
                type: [string, "null"]
    OptimizationFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [TRIP_CHANGED, DATA_CHANGED, LOCK_CONFLICT, ROUTE_UNAVAILABLE, NO_IMPROVEMENT, APPLY_FAILED]
        message:
          type: string
        retryable:
          type: boolean
    OptimizationDecisionRequest:
      type: object
      additionalProperties: false
      required: [proposalId, decision]
      properties:
        proposalId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [APPLY, KEEP]
    OptimizationDecision:
      type: object
      additionalProperties: false
      required: [id, runId, proposalId, decision, decidedAt, beforeRevisionId, resultingTripVersion]
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        proposalId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [APPLY, KEEP, REVERT]
        resultingTripVersion:
          type: [integer, "null"]
          format: int64
        beforeRevisionId:
          type: [string, "null"]
          format: uuid
        afterRevisionId:
          type: [string, "null"]
          format: uuid
        revertedDecisionId:
          type: [string, "null"]
          format: uuid
        revertUntil:
          type: [string, "null"]
          format: date-time
        decidedAt:
          type: string
          format: date-time
    OptimizationHistoryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/OptimizationHistoryItem"
        page:
          $ref: "#/components/schemas/CursorPage"
    OptimizationHistoryItem:
      type: object
      additionalProperties: false
      required: [runId, tripId, tripTitle, scope, status, runLink, queuedAt]
      properties:
        runId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        tripTitle:
          type: string
          maxLength: 100
        scope:
          $ref: "#/components/schemas/OptimizationScope"
        status:
          $ref: "#/components/schemas/OptimizationStatus"
        decision:
          type: [string, "null"]
          enum: [APPLY, KEEP, REVERT, null]
        runLink:
          type: string
          format: uri-reference
          pattern: '^/trips/[0-9a-fA-F-]{36}/optimizations/[0-9a-fA-F-]{36}$'
        queuedAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, "null"]
          format: date-time

    LiveAreaQuery:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [AUTO, LIVE_ONLY, REPLAY_ALLOWED]
          default: AUTO
        regionCode:
          type: [string, "null"]
          maxLength: 100
        viewport:
          oneOf:
            - $ref: "#/components/schemas/CoarseViewport"
            - type: "null"
    CoarseViewport:
      type: object
      additionalProperties: false
      required: [west, south, east, north]
      properties:
        west:
          type: number
          minimum: -180
          maximum: 180
          multipleOf: 0.001
        south:
          type: number
          minimum: -90
          maximum: 90
          multipleOf: 0.001
        east:
          type: number
          minimum: -180
          maximum: 180
          multipleOf: 0.001
        north:
          type: number
          minimum: -90
          maximum: 90
          multipleOf: 0.001
      description: east > west and north > south with each span at least 0.01 degrees.
    LiveAreaResult:
      type: object
      additionalProperties: false
      required: [mode, areas, generatedAt]
      properties:
        mode:
          $ref: "#/components/schemas/SourceState"
        areas:
          type: array
          items:
            $ref: "#/components/schemas/LiveArea"
        generatedAt:
          type: string
          format: date-time
    LiveArea:
      type: object
      additionalProperties: false
      required: [id, name, centroid, crowd]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        centroid:
          $ref: "#/components/schemas/GeoPoint"
        boundaryGeoJson:
          type: [object, "null"]
          additionalProperties: true
        crowd:
          $ref: "#/components/schemas/CrowdMetric"
    LivePlace:
      type: object
      additionalProperties: false
      required: [place, mappingType, fallbackUsed]
      properties:
        place:
          $ref: "#/components/schemas/PlaceSummary"
        mappingType:
          type: string
        fallbackUsed:
          type: boolean
        crowd:
          oneOf:
            - $ref: "#/components/schemas/CrowdMetric"
            - type: "null"
    LivePlaceDetail:
      type: object
      additionalProperties: false
      required: [place, dataState, related]
      properties:
        place:
          $ref: "#/components/schemas/PlaceDetail"
        dataState:
          $ref: "#/components/schemas/SourceState"
        crowd:
          oneOf:
            - $ref: "#/components/schemas/CrowdMetric"
            - type: "null"
        related:
          $ref: "#/components/schemas/RelatedPlaceResult"

    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, page, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          $ref: "#/components/schemas/CursorPage"
        unreadCount:
          type: integer
          minimum: 0
    Notification:
      type: object
      additionalProperties: false
      required: [id, type, title, body, deepLink, createdAt, read]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - OPTIMIZATION_READY
            - OPTIMIZATION_FAILED
            - CROWD_ALERT
            - TRIP_REMINDER
            - TRIP_CONFLICT
            - SOURCE_DEGRADED
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 500
        deepLink:
          type: string
          maxLength: 300
          pattern: '^/(trips/[0-9a-fA-F-]{36}(/optimizations/[0-9a-fA-F-]{36})?|live/(areas|places)/[0-9a-fA-F-]{36}|notifications|profile)$'
          description: Relative internal route from the fixed allowlist; schemes, hosts, query, and fragments are forbidden.
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
        readAt:
          type: [string, "null"]
          format: date-time
    MarkAllNotificationsReadResult:
      type: object
      additionalProperties: false
      required: [updatedCount, cutoffAt, unreadCount]
      properties:
        updatedCount:
          type: integer
          minimum: 0
        cutoffAt:
          type: string
          format: date-time
        unreadCount:
          type: integer
          minimum: 0

    EventBatch:
      type: object
      additionalProperties: false
      required: [schemaVersion, events]
      properties:
        schemaVersion:
          type: string
          const: "1.1.0"
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/ClientEvent"
    ClientEvent:
      type: object
      additionalProperties: false
      required: [eventId, name, occurredAt, context, properties]
      properties:
        eventId:
          type: string
          format: uuid
        name:
          type: string
          enum:
            - onboarding_completed
            - trip_created
            - candidate_save_started
            - candidate_saved
            - candidate_duplicate
            - candidate_save_failed
            - candidate_scheduled
            - trip_item_edited
            - optimization_requested
            - optimization_previewed
            - optimization_applied
            - optimization_kept
            - optimization_reverted
            - optimization_failed
            - live_place_opened
            - related_place_opened
            - data_guide_opened
        occurredAt:
          type: string
          format: date-time
        context:
          type: object
          additionalProperties: false
          required: [locale, timezone, route]
          description: Owner and demo session identifiers are bound server-side from the authenticated cookie.
          properties:
            locale:
              type: string
              minLength: 2
              maxLength: 35
            timezone:
              type: string
              minLength: 1
              maxLength: 100
            route:
              type: string
              maxLength: 200
              enum:
                - /
                - /language
                - /intro
                - /start
                - /feed
                - /posts/:postId
                - /trip/:tripId
                - /trip/:tripId/optimizations/:runId
                - /live
                - /profile
                - /about-data
                - /search
                - /notifications
                - /nearby/:poiId
                - /posts/new
              description: Route template only; no query string, fragment, search text, or identifier values.
            appVersion:
              type: [string, "null"]
        properties:
          type: object
          additionalProperties: true
          description: Validated again with docs/contracts/events.schema.json; no free text or location.
    EventBatchReceipt:
      type: object
      additionalProperties: false
      required: [accepted, duplicates, rejected]
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, instance, requestId, retryable]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - VALIDATION_FAILED
            - CSRF_INVALID
            - CURSOR_INVALID
            - CURSOR_EXPIRED
            - TRIP_CHANGED
            - DATA_CHANGED
            - LOCK_CONFLICT
            - ROUTE_UNAVAILABLE
            - NO_IMPROVEMENT
            - APPLY_FAILED
            - IDEMPOTENCY_KEY_REUSED
            - IMPORT_DRAFT_EXPIRED
            - IMPORT_DRAFT_CHANGED
            - PREVIEW_EXPIRED
            - DELETION_STATUS_EXPIRED
            - SOURCE_UNAVAILABLE
            - RATE_LIMITED
            - INTERNAL_ERROR
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        retryable:
          type: boolean
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        currentTripVersion:
          type: [integer, "null"]
          format: int64
        recomputeUrl:
          type: [string, "null"]
          format: uri-reference
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

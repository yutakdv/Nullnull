        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryCode:
          type: string
          minLength: 1
          maxLength: 100
        regionCode:
          type: string
          minLength: 1
          maxLength: 100
        thumbnailUrl:
          type: [string, "null"]

openapi: 3.1.0
info:
  title: Nullnull Public Web API
  version: 0.2.1-rc.1
  summary: Contract-first API for the Nullnull mobile travel planner
  description: |
    P0 implementation contract. Saved posts, trip candidates, and scheduled trip
    items are distinct resources. Optimization never mutates a trip before an
    explicit APPLY decision. All crowd and alternative-place data carries
    provenance and comparison eligibility.
  contact:
    name: Nullnull team
  license:
    name: Repository license not yet selected
    identifier: LicenseRef-TBD
servers:
  - url: /api/v1
    description: Same-origin API path for local, staging, and production
x-nullnull-contract-review:
  issue: https://github.com/yutakdv/Nullnull/issues/11
  status: proposed-pending-frontend-review
  previousVersion: 0.2.0
x-nullnull-common-contract:
  requestId: Every response, including errors and 204 responses, carries X-Request-ID.
  protectedErrors: Every session-protected operation may return 401 UNAUTHORIZED.
  rateLimitErrors: Every operation may return 429 RATE_LIMITED with Retry-After.
  cache: Owner-scoped, search, import, deletion, and optimization responses are never CDN cached.
  bounds: Unknown object fields are rejected and application limits are revalidated server-side.
x-nullnull-competition-contract:
  status: target-for-2026-submission
  submissionDeadline: "2026-09-21T16:00:00+09:00"
  accessMode: LOGIN_NOT_REQUIRED
  ktoOpenApi:
    requiredInDeployedService: true
    browserDirectCall: forbidden
    fileOrReplayOnly: forbidden
    callAuditWithoutSecret: required
    defaultAttributionText: "출처: ⓒ한국관광공사"
  locationCapability: disabled
  governingDocs:
    - ../contest/2026-관광데이터-활용-공모전-공지-심사기준.md
    - ../contest/COMPETITION_COMPLIANCE_MATRIX.md
tags:
  - name: System
    description: Health and operational readiness endpoints.
  - name: Session
    description: Anonymous session bootstrap, preferences, and deletion.
  - name: Feed
    description: Curated posts, feed state, and saved posts.
  - name: Places
    description: Canonical places, search, crowd forecasts, and relations.
  - name: Trips
    description: Owned trips and trip-level metadata.
  - name: Imports
    description: Ephemeral itinerary parsing and confirmation.
  - name: Candidates
    description: Trip-scoped unscheduled place candidates.
  - name: Trip items
    description: Scheduled places, ordering, replacement, and constraints.
  - name: Optimizations
    description: Preview-first optimization runs, decisions, and revert.
  - name: Live
    description: Live, forecast, replay, stale, and unavailable area data.
  - name: Notifications
    description: P1 notification list and read state.
  - name: Analytics
    description: Allowlisted, privacy-minimized client events.

paths:
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      security: []
      summary: Process liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      summary: Application readiness probe
      responses:
        "200":
          description: Required dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /demo/sessions:
    post:
      tags: [Session]
      operationId: createDemoSession
      security: []
      summary: Create the first anonymous demo session
      description: |
        Creates an Owner and HttpOnly session cookie only when no valid session exists.
        This bootstrap operation is intentionally outside owner-scoped idempotency: a retry
        carrying a cookie returns 200 and the existing owner; a transport failure before any
        cookie is stored may leave an ownerless bootstrap record that is purged after 15 minutes.
        A valid cookie is never replaced merely because this endpoint is retried. Use
        POST /session/csrf to obtain an additional tab-local CSRF token.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDemoSessionRequest"
      responses:
        "200":
          description: Existing valid anonymous session resumed
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBootstrap"
        "201":
          description: Anonymous session created
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            Set-Cookie:
              description: Secure HttpOnly session cookie
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBootstrap"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Problem"
  /session/csrf:
    post:
      tags: [Session]
      operationId: issueCsrfToken
      summary: Issue a tab-local CSRF token for an existing session
      description: |
        Safe bootstrap endpoint for refresh and new tabs. It requires a valid session cookie
        and a same-origin Origin or Referer, but no existing CSRF token. Issuing a token does
        not invalidate other tokens while fewer than five unexpired hashes exist. Each token
        expires independently. When issuing a sixth unexpired token, the least recently used
        token (last_used_at, falling back to created_at) is evicted; ties use created_at then id.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: A new independently valid CSRF token
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /demo/readiness:
    get:
      tags: [System]
      operationId: getDemoReadiness
      security:
        - sessionCookie: []
      summary: Check whether P0 demo datasets and sources are usable
      responses:
        "200":
          description: Per-capability readiness
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoReadiness"
        default:
          $ref: "#/components/responses/Problem"
  /session:
    delete:
      tags: [Session]
      operationId: deleteCurrentSession
      summary: Revoke the current session and request owned-data deletion
      description: |
        Atomically records the idempotent receipt, revokes the session and CSRF tokens, and
        queues deletion. For 24 hours only this route may resolve the revoked cookie plus the
        same Idempotency-Key to replay the same receipt; all other use of that cookie is 401.
        The status token is deterministically signed for the receipt and never stored plaintext.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Session revoked and deletion job accepted
          headers:
            Location:
              description: Deletion status resource URL.
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionReceipt"
        default:
          $ref: "#/components/responses/Problem"
  /deletion-requests/{deletionRequestId}:
    parameters:
      - $ref: "#/components/parameters/DeletionRequestId"
    get:
      tags: [Session]
      operationId: getDeletionRequest
      summary: Get an owned-data deletion job status after session revocation
      description: |
        Uses the receipt-scoped status token returned in DeletionReceipt because the original session
        is already revoked. The raw token is held in memory only, sent in a header, stored only
        as a hash, expires after seven days, and can be reused for polling until expiry. It cannot
        read any deleted domain data. A matching expired token returns 410; an unknown token returns 404.
      security:
        - deletionStatusToken: []
      responses:
        "200":
          description: Current deletion status
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
            Retry-After:
              description: |
                Whole seconds to wait before asking again. Present only while the request is still
                moving: absent on COMPLETED and FAILED, because another call would return what the
                caller already has. The server derives it from its own job runtime - the poll interval
                while work is queued or running, and the time until the next attempt is due after a
                PARTIAL_FAILED - so it is advice that tracks the deployment, not a fixed figure. Prefer
                it over a hardcoded interval when it is present.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRequestStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: Status token or receipt expired
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                statusExpired:
                  summary: The receipt outlived its status token
                  description: |
                    410 means the request existed and its token has expired; 404 means no answer is
                    available, whether the id is unknown, the token does not verify, or its hash was
                    already erased. Show the two differently: 410 is "the window closed", 404 is "this
                    receipt cannot be opened".
                  value:
                    type: "/problems/deletion-status-expired"
                    title: "Deletion status expired"
                    status: 410
                    code: "DELETION_STATUS_EXPIRED"
                    detail: "The deletion status is no longer available."
                    instance: "/api/v1/trips/018f3f8e-9b67-7a21-8d31-31d315b93911"
                    requestId: "01J8Z9K2Q4R6T8V0X2Z4B6D8F0"
                    retryable: false
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      tags: [Session]
      operationId: getCurrentOwner
      summary: Get the current owner and preferences
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current anonymous or account owner
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Session]
      operationId: updatePreferences
      summary: Update locale, timezone, onboarding, or active trip
      description: |
        JSON Merge Patch: omitted fields are preserved; activeTripId null clears the selection.
        Null is invalid for locale, timezone, and onboardingCompleted. Unsupported locale returns
        422 VALIDATION_FAILED with field code UNSUPPORTED_LOCALE (P0 supports ko-KR and en-US).
        Invalid timezone returns INVALID_TIMEZONE. A missing, deleted, or foreign-owner trip returns
        the same TRIP_NOT_FOUND field error. Repeating onboardingCompleted has no additional effect.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesRequest"
      responses:
        "200":
          description: Preferences updated
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProfile"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        default:
          $ref: "#/components/responses/Problem"

  /feed:
    get:
      tags: [Feed]
      operationId: listFeed
      summary: List personalized feed cards
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: tripId
          in: query
          description: Adds candidate state for the selected trip without changing ranking semantics.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cursor page of feed cards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
        default:
          $ref: "#/components/responses/Problem"
  /feed/feedback:
    post:
      tags: [Feed]
      operationId: recordFeedFeedback
      summary: Record an allowlisted feed interaction
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedFeedbackRequest"
      responses:
        "204":
          description: Feedback accepted
        default:
          $ref: "#/components/responses/Problem"
  /posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      tags: [Feed]
      operationId: getPost
      summary: Get a post and its linked places
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Post details and linked places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /posts/{postId}/saved:
    parameters:
      - $ref: "#/components/parameters/PostId"
    put:
      tags: [Feed]
      operationId: savePost
      summary: Save a post independently of any trip
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Existing saved-post state returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPostState"
              examples:
                alreadySaved:
                  summary: The post was already saved
                  description: |
                    duplicate is true and savedAt is the ORIGINAL save time, not now: saving again is
                    idempotent and does not move the timestamp. Saving a post never schedules anything -
                    a SavedPost, a TripCandidate and a TripItem are separate resources, which is why this
                    body carries no trip, no version and no schedule field at all.
                  value:
                    postId: "018f5b00-0000-7000-8000-000000000001"
                    saved: true
                    duplicate: true
                    savedAt: "2026-09-11T05:40:00Z"
        "201":
          description: Post saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPostState"
              examples:
                newlySaved:
                  summary: The post was saved for the first time
                  description: |
                    duplicate is false and savedAt is when the save happened. Compare with the 200 above:
                    the only difference is duplicate, so a client can treat both as "it is saved now"
                    and use duplicate solely to decide whether to announce it.
                  value:
                    postId: "018f5b00-0000-7000-8000-000000000001"
                    saved: true
                    duplicate: false
                    savedAt: "2026-09-11T05:40:00Z"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Feed]
      operationId: unsavePost
      summary: Remove a saved-post relation
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Saved-post relation removed or already absent
        default:
          $ref: "#/components/responses/Problem"

  /places/search:
    post:
      tags: [Places]
      operationId: searchPlaces
      summary: Search canonical places
      description: |
        Read-only POST so free-form search text does not enter CDN, ALB, proxy, or browser URL
        logs. The body is excluded from application/APM logging and responses use no-store.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceSearchRequest"
      responses:
        "200":
          description: Canonical place search results
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceSearchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Problem"
  /places/{placeId}:
    parameters:
      - $ref: "#/components/parameters/PlaceId"
    get:
      tags: [Places]
      operationId: getPlace
      summary: Get canonical place details
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Canonical place detail
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceDetail"
              examples:
                canonicalPlace:
                  summary: A canonical place collected from the KTO source
                  description: |
                    Matches the server projection. `description`, `thumbnailUrl` and `thumbnailAsset` are null
                    because the collector requests `overviewYN=N` and `firstImageYN=N`, so overview text and
                    images are never stored. `categoryName` and `regionName` stay null until a reviewed
                    code-to-label mapping exists; render those, never the opaque `categoryCode`/`regionCode`.
                    `sourceAttribution.attribution` is displayed verbatim.
                  value:
                    id: "018f4b20-1a44-7e11-9c02-5d7e3f1a2b01"
                    name: "경복궁"
                    categoryCode: "HS"
                    regionCode: "11"
                    categoryName: null
                    regionName: null
                    thumbnailUrl: null
                    thumbnailAsset: null
                    address: "서울 종로구 사직로 161"
                    description: null
                    location:
                      latitude: 37.579617
                      longitude: 126.977041
                    externalRefs:
                      - source: "KTO_KOR_SERVICE_2"
                        externalId: "KTO-PENDING-CAPTURE"
                        verifiedAt: "2026-09-11T00:00:00Z"
                    sourceAttribution:
                      source: "KTO_KOR_SERVICE_2"
                      sourceDisplayName: "한국관광공사 국문 관광정보"
                      sourceRegistryVersion: 4
                      attribution: "출처: ⓒ한국관광공사"
                      officialUrl: "https://www.data.go.kr/data/15101578/openapi.do"
                      licenseUrl: "https://www.data.go.kr/ugs/selectPortalPolicyView.do"
                      license: "이용허락범위 제한 없음 (관광정보 텍스트; 이미지 별도 심사)"
        "404":
          $ref: "#/components/responses/NotFound"
  /places/{placeId}/crowd-forecast:
    parameters:
      - $ref: "#/components/parameters/PlaceId"
    get:
      tags: [Places]
      operationId: getPlaceCrowdForecast
      summary: Get a place crowd forecast series
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Forecast series; may explicitly be unavailable
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrowdSeries"
        default:
          $ref: "#/components/responses/Problem"
  /places/{placeId}/related:
    parameters:
      - $ref: "#/components/parameters/PlaceId"
    get:
      tags: [Places]
      operationId: listRelatedPlaces
      summary: List evidence-backed related places
      security:
        - sessionCookie: []
      parameters:
        - name: at
          in: query
          schema:
            type: string
            format: date-time
        - name: source
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Verified, similar, pending, unknown, or no candidate result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedPlaceResult"
        default:
          $ref: "#/components/responses/Problem"

  /trips:
    get:
      tags: [Trips]
      operationId: listTrips
      summary: List trips owned by the current owner
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TripStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Trips owned by the current owner only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripPage"
              examples:
                trips:
                  summary: Two trips the owner owns
                  description: |
                    candidateCount is the trip's own total. The list carries no candidates array; read the
                    complete trip through getTrip and the paginated candidates through listTripCandidates.
                  value:
                    items:
                      -
                        id: "018f4a10-2c31-7d42-9a55-6b1f0c3e8a01"
                        title: "서울 가을 여행"
                        startDate: "2026-10-04"
                        endDate: "2026-10-07"
                        timezone: "Asia/Seoul"
                        status: "ACTIVE"
                        version: 3
                        candidateCount: 5
                      -
                        id: "018f4a10-2c31-7d42-9a55-6b1f0c3e8a02"
                        title: "부산 겨울 여행"
                        startDate: "2026-12-20"
                        endDate: "2026-12-22"
                        timezone: "Asia/Seoul"
                        status: "DRAFT"
                        version: 1
                        candidateCount: 0
                      -
                        id: "018f4a10-2c31-7d42-9a55-6b1f0c3e8a04"
                        title: "관심사만 정한 여행"
                        startDate: "2026-10-04"
                        endDate: "2026-10-07"
                        timezone: "Asia/Seoul"
                        status: "ACTIVE"
                        version: 3
                        candidateCount: 5
                    page:
                      nextCursor: null
                      hasMore: false
                noTrips:
                  summary: No trips yet
                  description: |
                    hasMore is false and nextCursor is null, which is the end of the list rather than an error.
                  value:
                    items: []
                    page:
                      nextCursor: null
                      hasMore: false
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Trips]
      operationId: createTrip
      summary: Create a trip from structured input
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "201":
          description: Trip created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
              examples:
                createdTrip:
                  summary: A new trip seeded with one empty day per date
                  description: |
                    version is 1 and the ETag is "1". Every date in the range gets a day, each with an empty
                    items array, which is the deterministic seed the wizard produces before anything is scheduled.
                  value:
                    id: "018f4a10-2c31-7d42-9a55-6b1f0c3e8a03"
                    title: "새 여행"
                    startDate: "2026-10-04"
                    endDate: "2026-10-07"
                    timezone: "Asia/Seoul"
                    status: "DRAFT"
                    version: 1
                    candidateCount: 0
                    planningLevel: "NOTHING"
                    interests: []
                    days:
                      -
                        date: "2026-10-04"
                        items: []
                      -
                        date: "2026-10-05"
                        items: []
                      -
                        date: "2026-10-06"
                        items: []
                      -
                        date: "2026-10-07"
                        items: []
                    candidates: []
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/Problem"
  /trips/{tripId}:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      tags: [Trips]
      operationId: getTrip
      summary: Get a trip with days, items, constraints, and candidates
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Complete trip view
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
              examples:
                scheduledTrip:
                  summary: A trip with items scheduled across its days
                  description: |
                    The ETag is the quoted version, here "3"; send it back as If-Match on any mutation.
                    candidates is empty while candidateCount is 5 - the array is a bounded view, never the total.
                  value:

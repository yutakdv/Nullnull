  /trips/{tripId}/optimizations:
    parameters:
      - $ref: "#/components/parameters/TripId"
    post:
      tags: [Optimizations]
      operationId: createOptimization
      summary: Queue a preview-only optimization run
      description: |
        Synchronous preflight checks ownership, target/scope shape, input trip version, and
        current locks, then freezes the input revision. External data and route checks execute
        asynchronously; failure is reported on the run and never mutates the trip. ITEM requires
        exactly targetItemId, DAY requires exactly targetDate, and TRIP accepts neither target.
      x-error-codes:
        "409": [TRIP_CHANGED]
        "422": [LOCK_CONFLICT]
        "429": [RATE_LIMITED]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOptimizationRequest"
      responses:
        "202":
          description: Optimization queued
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationRun"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/Problem"

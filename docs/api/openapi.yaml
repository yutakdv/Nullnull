          type: string
          const: REVERT
        resultingTripVersion:
          type: integer
          format: int64
        beforeRevisionId:
          type: string
          format: uuid
          description: Revision active immediately before the revert transaction.
        afterRevisionId:
          type: string
          format: uuid
          description: New revision created by restoring the applied decision's before snapshot.
        revertedDecisionId:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time

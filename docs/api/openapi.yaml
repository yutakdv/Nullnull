          items:
            $ref: "#/components/schemas/OptimizationHistoryItem"
        page:
          $ref: "#/components/schemas/CursorPage"
    OptimizationHistoryItem:
      type: object
      additionalProperties: false
      required: [runId, tripId, tripTitle, scope, status, runLink, queuedAt]
      properties:
        runId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        tripTitle:
          type: string
          maxLength: 100
        scope:
          $ref: "#/components/schemas/OptimizationScope"
        status:
          $ref: "#/components/schemas/OptimizationStatus"
        decision:
          type: [string, "null"]
          enum: [APPLY, KEEP, REVERT, null]
        runLink:
          type: string
          format: uri-reference
          pattern: '^/trip/[0-9a-fA-F-]{36}/optimizations/[0-9a-fA-F-]{36}$'
          description: |
            Client router path for the run screen. This is not an API path: the `/api/v1` server base is
            not included and the value must not be used as a request URL. Callers may navigate to it
            verbatim, or rebuild it from `tripId` and `runId`, which are both required here.
        queuedAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, "null"]
          format: date-time

    LiveAreaQuery:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [AUTO, LIVE_ONLY, REPLAY_ALLOWED]
          default: AUTO
        regionCode:
          type: [string, "null"]
          maxLength: 100
        viewport:
          oneOf:
            - $ref: "#/components/schemas/CoarseViewport"
            - type: "null"
    CoarseViewport:
      type: object
      additionalProperties: false
      required: [west, south, east, north]
      properties:
        west:
          type: number
          minimum: -180
          maximum: 180
          multipleOf: 0.001
        south:
          type: number
          minimum: -90
          maximum: 90
          multipleOf: 0.001
        east:
          type: number
          minimum: -180
          maximum: 180
          multipleOf: 0.001
        north:
          type: number
          minimum: -90
          maximum: 90
          multipleOf: 0.001
      description: east > west and north > south with each span at least 0.01 degrees.
    LiveAreaResult:
      type: object

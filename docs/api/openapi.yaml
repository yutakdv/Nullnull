            - OPTIMIZATION_FAILED
            - CROWD_ALERT
            - TRIP_REMINDER
            - TRIP_CONFLICT
            - SOURCE_DEGRADED
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 500
        deepLink:
          type: string
          maxLength: 300
          pattern: '^/(trips/[0-9a-fA-F-]{36}(/optimizations/[0-9a-fA-F-]{36})?|live/(areas|places)/[0-9a-fA-F-]{36}|notifications|profile)$'
          description: Relative internal route from the fixed allowlist; schemes, hosts, query, and fragments are forbidden.
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean

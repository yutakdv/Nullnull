        placeId:
          type: string
          format: uuid
        candidateId:
          type: [string, "null"]
          format: uuid
        date:
          type: string
          format: date
        position:
          type: integer
          minimum: 0
        startTime:
          type: [string, "null"]
          format: time
        durationMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 1440
        note:
          type: [string, "null"]
          maxLength: 500
        constraints:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SetConstraintInput"
    UpdateTripItemRequest:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        position:
          type: integer
          minimum: 0
        startTime:
          type: [string, "null"]
          format: time
        durationMinutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 1440
        note:
          type: [string, "null"]
          maxLength: 500
      minProperties: 1
    ReorderTripItemsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [itemId, date, position]
            properties:
              itemId:
                type: string
                format: uuid
              date:
                type: string
                format: date
              position:
                type: integer
                minimum: 0
    ReplaceTripItemRequest:
      type: object
      additionalProperties: false
